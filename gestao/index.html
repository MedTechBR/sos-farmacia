<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Gestão da farmácia · SOS Farmácia Comercial</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<meta name="theme-color" content="#F5F6FB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1017" media="(prefers-color-scheme: dark)">
<script>
/* tema escolhido no SOS vale aqui também (mesma chave), antes do primeiro desenho */
(function(){ try{ var t=JSON.parse(localStorage.getItem('sos-farmacia:tema')); if(t) document.documentElement.dataset.tema=t; }catch(e){} })();
/* Conta MedTech e compra, igual ao SOS: só no site (no file:// e na prévia do localhost o app abre sem conta;
   teste do portão com ?portao=1). A Gestão faz parte do produto sosfarmacia. */
(function () {
  var l = location, local = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(l.hostname);
  if (!/^https?:$/.test(l.protocol) || (local && !/[?&]portao=1\b/.test(l.search))) return;
  window.__sosPortao = true;
  ['../mtsync.js?v=1', '/_mtacesso.js?v=13', 'conta-gestao.js?v=2', '/_mtvoltar.js?v=3'].forEach(function (s) {
    document.write('<script data-sos-portao src="' + s + '"><\/script>');
  });
})();
</script>
<style>
/* ============================================================
   TOKENS — uma fonte da verdade para cor, espaço, tipo e sombra.
   Tema claro por padrão; escuro por preferência do sistema ou
   pelo botão (data-tema no <html> vence a mídia).
   ============================================================ */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--bg);letter-spacing:-.011em;-webkit-font-smoothing:antialiased;min-height:100dvh;touch-action:manipulation}
:where(button,a,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:var(--r1)}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

/* ================= shell: header + navegação ================= */
header.top{background:var(--surface);border-bottom:1px solid var(--line);padding:var(--s3) var(--s4);display:flex;align-items:center;gap:var(--s3);position:sticky;top:0;z-index:30;padding-top:max(var(--s3),env(safe-area-inset-top))}
.logo{display:flex;align-items:center;gap:11px;font-weight:800;font-size:18px;letter-spacing:-.4px;min-width:0}
.logo .mark{width:36px;height:36px;border-radius:var(--r2);background:var(--brand-solid);color:var(--on-brand);display:grid;place-items:center;font-size:21px;flex:0 0 auto}
.logo small{display:block;font-weight:500;font-size:11.5px;color:var(--muted);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;gap:var(--s2);align-items:center}
.icon-btn{width:40px;height:40px;border-radius:var(--r2);border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);display:grid;place-items:center;font-size:19px;cursor:pointer;transition:background .15s,color .15s,border-color .15s}
.icon-btn:hover{background:var(--surface-2);color:var(--ink);border-color:var(--brand)}
nav.tabs{background:var(--surface);border-bottom:1px solid var(--line);display:flex;gap:2px;padding:0 var(--s3);overflow-x:auto;scrollbar-width:none;position:sticky;top:63px;z-index:29}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:none;color:var(--muted);font-family:inherit;font-weight:600;font-size:13.5px;padding:13px 14px;cursor:pointer;border-bottom:2.5px solid transparent;white-space:nowrap;display:flex;align-items:center;gap:6px;min-height:46px;transition:color .15s,border-color .15s}
nav.tabs button[aria-selected="true"]{color:var(--brand-strong);border-bottom-color:var(--brand)}
nav.tabs button:hover{color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:var(--s5) var(--s4) calc(72px + env(safe-area-inset-bottom))}

/* ================= superfícies ================= */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r3);box-shadow:var(--sh2);padding:var(--s5);margin-bottom:var(--s4)}
.card h2{margin:0 0 var(--s1);font-size:16px;font-weight:700;display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.card h2 .ti{color:var(--brand);font-size:20px}
.card .hint{color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 var(--s4)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:var(--s3)}

/* ================= formulários ================= */
label.f{display:block;font-weight:600;font-size:12.5px;margin-bottom:5px;color:var(--ink)}
.f-wrap{display:flex;flex-direction:column}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line-strong);border-radius:var(--r2);font-size:16px;font-family:inherit;background:var(--surface);color:var(--ink);min-height:44px}
@media (min-width:641px){input,select,textarea{font-size:14px;min-height:42px}}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:var(--ring)}
input[type=checkbox]{min-height:0}

/* ================= botões ================= */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;border-radius:var(--r2);padding:11px 16px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;text-decoration:none;min-height:44px;transition:background .15s,color .15s,border-color .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand-solid);color:var(--on-brand)}.btn-primary:hover{background:var(--brand-solid-hover)}
.btn-primary:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn-ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}.btn-ghost:hover{background:var(--surface-2);border-color:var(--brand)}
.btn-danger{background:var(--surface);color:var(--danger);border:1px solid var(--danger-line)}.btn-danger:hover{background:var(--danger-soft)}
.btn-sm{padding:8px 12px;font-size:13px;min-height:40px;border-radius:var(--r2)}
.btn-icon{min-width:44px;padding-left:10px;padding-right:10px}
/* no toque e no telefone, todo alvo vai a 44px */
@media (pointer:coarse),(max-width:560px){.btn-sm{min-height:44px}.icon-btn{width:44px;height:44px}}
.row-actions{display:flex;gap:var(--s2);flex-wrap:wrap;margin-top:var(--s4)}

/* ================= importação ================= */
.drop{border:2px dashed var(--line-strong);border-radius:var(--r3);padding:22px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s;background:var(--surface-2)}
.drop:hover,.drop.over{border-color:var(--brand);background:var(--brand-soft)}
.drop .ti{font-size:30px;color:var(--brand)}
.drop p{margin:8px 0 2px;font-weight:600;font-size:14px}
.drop small{color:var(--muted);font-size:12.5px}

/* ================= tags ================= */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;background:var(--brand-soft);color:var(--brand-strong);border:1px solid var(--brand-line);white-space:nowrap}
.tag.gray{background:var(--surface-2);color:var(--muted);border-color:var(--line-strong)}
/* cores por categoria — atribuídas por índice, então categoria nova também ganha cor */
.tag.c0,.tag.balconista{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}
.tag.c1,.tag.entregador{background:#fff7ed;color:#c2410c;border-color:#fed7aa}
.tag.c2,.tag.caixa{background:#faf5ff;color:#7e22ce;border-color:#e9d5ff}
.tag.c3{background:#fdf2f8;color:#be185d;border-color:#fbcfe8}
.tag.c4{background:#f0fdfa;color:#0f766e;border-color:#99f6e4}
.tag.c5{background:#fefce8;color:#a16207;border-color:#fde68a}
:root[data-tema="escuro"] .tag.c1,:root[data-tema="escuro"] .tag.entregador{background:#2a1a0d;color:#fdba74;border-color:#4d3016}
:root[data-tema="escuro"] .tag.c2,:root[data-tema="escuro"] .tag.caixa{background:#1f1430;color:#d8b4fe;border-color:#3d2560}
:root[data-tema="escuro"] .tag.c3{background:#2b1121;color:#f9a8d4;border-color:#4d1f3a}
:root[data-tema="escuro"] .tag.c4{background:#0d2724;color:#5eead4;border-color:#14504a}
:root[data-tema="escuro"] .tag.c5{background:#2a2410;color:#fde047;border-color:#4d431a}
@media (prefers-color-scheme:dark){
  :root:not([data-tema="claro"]) .tag.c1,:root:not([data-tema="claro"]) .tag.entregador{background:#2a1a0d;color:#fdba74;border-color:#4d3016}
  :root:not([data-tema="claro"]) .tag.c2,:root:not([data-tema="claro"]) .tag.caixa{background:#1f1430;color:#d8b4fe;border-color:#3d2560}
  :root:not([data-tema="claro"]) .tag.c3{background:#2b1121;color:#f9a8d4;border-color:#4d1f3a}
  :root:not([data-tema="claro"]) .tag.c4{background:#0d2724;color:#5eead4;border-color:#14504a}
  :root:not([data-tema="claro"]) .tag.c5{background:#2a2410;color:#fde047;border-color:#4d431a}
}
.tag.folga{background:var(--danger-soft);color:var(--danger-ink);border-color:var(--danger-line)}
.tag.troca{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-line)}
.tag.extra{background:var(--info-soft);color:var(--info);border-color:var(--info-line)}

/* ================= tabelas ================= */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line)}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:none}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r2)}
.tbl-wrap.scroll-y{max-height:min(70vh,620px);overflow-y:auto}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:26px 10px;font-size:14px;line-height:1.55}
.empty .ti{font-size:34px;display:block;margin-bottom:8px;color:var(--line-strong)}

/* ================= lista de funcionários ================= */
.emp-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:var(--s2)}
.emp{display:flex;align-items:center;gap:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r2);padding:11px 12px;cursor:pointer;transition:border-color .15s,background .15s;text-align:left;min-height:62px;font-family:inherit;color:inherit}
.emp:hover{border-color:var(--brand);background:var(--brand-soft)}
.emp .av{width:38px;height:38px;border-radius:var(--r2);background:var(--brand-solid);color:var(--on-brand);display:grid;place-items:center;font-weight:800;font-size:15px;flex:0 0 auto}
.emp .nm{flex:1;min-width:0}
.emp .nm b{display:block;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp .nm span{font-size:12px;color:var(--muted)}
.search-wrap{position:relative;margin-bottom:var(--s3)}
.search-wrap .ti-search{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:18px;pointer-events:none}
.search-wrap input{padding-left:38px}

/* ================= escala do dia ================= */
.shift{border:1px solid var(--line);border-radius:var(--r3);margin-bottom:var(--s3);overflow:hidden}
.shift .head{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);padding:11px 14px;background:var(--brand-soft);border-bottom:1px solid var(--brand-line)}
.shift .head b{font-size:14.5px}
.shift .head .time{font-size:12px;color:var(--brand-strong);font-weight:600;font-variant-numeric:tabular-nums}
.shift .body{padding:6px 14px}
.line{display:flex;align-items:center;gap:var(--s2);padding:9px 0;border-bottom:1px dashed var(--line)}
.line:last-child{border-bottom:none}
.line .nm{flex:1;font-weight:600;font-size:14px}
.line .hr{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.alert{display:flex;gap:var(--s2);align-items:flex-start;padding:12px 14px;border-radius:var(--r2);margin-bottom:var(--s2);font-size:13.5px;line-height:1.5}
.alert .ti{font-size:20px;flex:0 0 auto;margin-top:1px}
.alert.danger{background:var(--danger-soft);border:1px solid var(--danger-line);color:var(--danger-ink)}
.alert.ok{background:var(--brand-soft);border:1px solid var(--brand-line);color:var(--brand-strong)}
.alert.warn{background:var(--warn-soft);border:1px solid var(--warn-line);color:var(--warn)}
.alert.info{background:var(--info-soft);border:1px solid var(--info-line);color:var(--info)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.daybar{display:flex;align-items:flex-end;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s2)}

/* resumo do dia */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:var(--s2);margin-top:var(--s3)}
.stat{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r2);padding:11px 13px}
.stat .v{font-size:22px;font-weight:800;line-height:1.15;font-variant-numeric:tabular-nums}
.stat .k{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;align-items:center;gap:4px;margin-top:2px}
.stat.bad .v{color:var(--danger)}.stat.good .v{color:var(--ok)}

/* matriz de cobertura */
.cov td.cell{text-align:center;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.cov td.cell.ok{background:var(--brand-soft);color:var(--brand-strong)}
.cov td.cell.miss{background:var(--danger-soft);color:var(--danger-ink)}
.cov td.cell .ti{font-size:13px;vertical-align:-1px;margin-right:2px}

/* visão de semana */
.week{display:grid;grid-template-columns:repeat(7,minmax(104px,1fr));gap:var(--s1);min-width:760px}
.wday{border:1px solid var(--line);border-radius:var(--r2);background:var(--surface-2);padding:8px;text-align:left;cursor:pointer;font-family:inherit;color:inherit;transition:border-color .15s,background .15s}
.wday:hover{border-color:var(--brand);background:var(--brand-soft)}
.wday[aria-current="date"]{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}
.wday .wd{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
.wday .dt{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;margin:1px 0 6px}
.wday .wrow{display:flex;justify-content:space-between;gap:6px;font-size:11.5px;padding:2px 0;border-top:1px dashed var(--line);font-variant-numeric:tabular-nums}
.wday .wrow .wl{color:var(--muted);font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wday .wrow .wv{font-weight:700}
.wday .wflag{margin-top:6px;font-size:10.5px;font-weight:700;display:flex;align-items:center;gap:3px;border-radius:6px;padding:2px 5px}
.wday .wflag.miss{background:var(--danger-soft);color:var(--danger-ink)}
.wday .wflag.hol{background:var(--warn-soft);color:var(--warn)}

/* semana / dia da pessoa */
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:var(--s2)}
.dow .d{border:1px solid var(--line);border-radius:var(--r1);padding:7px 4px;text-align:center;font-size:11.5px}
.dow .d b{display:block;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:3px}
.dow .d.work{background:var(--brand-soft);border-color:var(--brand-line)}
.dow .d.off{background:var(--danger-soft);border-color:var(--danger-line);color:var(--danger-ink)}
.saldo{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.saldo.pos{color:var(--ok)}.saldo.neg{color:var(--danger)}.saldo.zero{color:var(--muted)}
.kv{display:flex;justify-content:space-between;gap:var(--s3);padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--muted);font-weight:600}
.kv .v{font-weight:700;text-align:right}

/* selo de pendência na aba */
.tab-badge{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 5px;margin-left:6px;
  border-radius:99px;background:var(--danger);color:#fff;font-size:11px;font-weight:800;line-height:1}

/* marcador de troca na escala do dia */
.troca-mark{background:var(--warn-soft);color:var(--warn);border:1px solid #fde68a;border-radius:var(--r1);
  font-weight:900;font-size:15px;line-height:1;margin-left:6px;cursor:pointer;font-family:inherit;
  min-width:28px;height:28px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center;
  vertical-align:middle;transition:background .15s,transform .1s}
.troca-mark:hover{background:#fde68a}
.troca-mark:active{transform:scale(.94)}
:root[data-tema="escuro"] .troca-mark{background:#3a2a10;color:#fbbf24;border-color:#78500f}
@media(prefers-color-scheme:dark){:root:not([data-tema="claro"]) .troca-mark{background:#3a2a10;color:#fbbf24;border-color:#78500f}}

/* ================= escala mensal ================= */
table.grid-tally, table.grid-escala{border-collapse:separate;border-spacing:0;font-size:13px;min-width:max-content}
table.grid-tally th, table.grid-tally td, table.grid-escala th, table.grid-escala td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:7px 9px;background:var(--surface)}
table.grid-tally .stik, table.grid-escala .stik{position:sticky;left:0;z-index:2;text-align:left;min-width:150px;box-shadow:1px 0 0 var(--line)}
table.grid-tally thead th, table.grid-escala thead th{position:sticky;top:0;z-index:1;font-size:11px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);font-weight:700;white-space:nowrap;box-shadow:0 1px 0 var(--line)}
table.grid-tally thead .stik, table.grid-escala thead .stik{z-index:3}
table.grid-escala th.dom{color:var(--danger)}
table.grid-escala thead th span{display:block;font-size:9px;font-weight:600;opacity:.7}
table.grid-escala td.cel{text-align:center;font-weight:700;font-size:11.5px;white-space:nowrap;min-width:34px}
.cel.turno{color:var(--ink)}
.cel.folga{background:var(--warn-soft);color:var(--warn)}
.cel.domingo{background:var(--brand-soft);color:var(--brand-dark)}
.cel.ferias{background:#dcfce7;color:#15803d}
.cel.feriado{background:var(--danger-soft);color:var(--danger)}
.cel.aniv{background:#f3e8ff;color:#7e22ce}
.cel.outro{background:var(--surface-2);color:var(--muted)}
.cel-leg{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;font-weight:600;border:1px solid var(--line)}
.cel-leg.folga{background:var(--warn-soft);color:var(--warn)}
.cel-leg.domingo{background:var(--brand-soft);color:var(--brand-dark)}
.cel-leg.ferias{background:#dcfce7;color:#15803d}
.cel-leg.feriado{background:var(--danger-soft);color:var(--danger)}
.cel-leg.aniv{background:#f3e8ff;color:#7e22ce}
.cel-leg.turno{background:var(--surface-2);color:var(--ink)}
:root[data-tema="escuro"] .cel.ferias, :root[data-tema="escuro"] .cel-leg.ferias{background:#14351f;color:#4ade80}
:root[data-tema="escuro"] .cel.aniv, :root[data-tema="escuro"] .cel-leg.aniv{background:#2a1840;color:#c084fc}
@media(prefers-color-scheme:dark){:root:not([data-tema="claro"]) .cel.ferias,:root:not([data-tema="claro"]) .cel-leg.ferias{background:#14351f;color:#4ade80}
:root:not([data-tema="claro"]) .cel.aniv,:root:not([data-tema="claro"]) .cel-leg.aniv{background:#2a1840;color:#c084fc}}

/* ================= recebimento ================= */
.prog{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--brand-solid);transition:width .3s}
.rec-item{display:flex;align-items:center;gap:var(--s3);padding:10px 12px;border:1px solid var(--line);border-radius:var(--r2);background:var(--surface-2);margin-bottom:6px}
.rec-item.feito{background:var(--brand-soft);border-color:var(--brand-line)}
.rec-item.feito .rec-nm b{text-decoration:line-through;opacity:.65}
.rec-chk{display:grid;place-items:center;width:44px;height:44px;flex:0 0 auto;cursor:pointer;margin:-6px 0 -6px -6px}
.rec-chk input{width:22px;height:22px;min-height:0;accent-color:var(--brand-solid);cursor:pointer}
.rec-nm{flex:1;min-width:0}
.rec-nm b{display:block;font-size:14px;font-weight:700;line-height:1.35}
.rec-nm .muted{font-size:12px}
.rec-item .btn-sm{flex:0 0 auto;min-width:44px;padding-left:10px;padding-right:10px}

@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:12px 18px;border-radius:var(--r2);font-size:14px;font-weight:600;box-shadow:var(--sh3);z-index:90;max-width:90%;animation:pop .18s ease-out}

/* alvos de toque: reafirmado no fim para vencer as regras base acima */

/* ================= impressão: a escala vai pro balcão ================= */
@media print{

/* ============================================================
   Gestão da farmácia — camada SOS (15/10/2026)
   O FarmáciaGest entrou no SOS Farmácia Comercial com a linguagem visual do SOS:
   papel claro, barra lateral com ícones em círculo, uma cor por seção (--ac no body),
   cartões de canto grande, botões em pílula, fonte do sistema, escuro seguindo o aparelho.
   Os nomes de classe do app antigo continuam; aqui só os tokens e a casca mudam.
   ============================================================ */
:root{
  --papel:#F5F6FB; --sup:#FFFFFF; --sup2:#F1F3F9; --sup3:#E7EAF3;
  --ink:#141827; --ink2:#5D6579; --ink3:#8E96AA; --linha:#E6E9F2; --linhaF:#D3D8E5;
  --c-indigo:#5B5BF0; --c-azul:#2F7BF6; --c-laranja:#F76E1E; --c-verde:#11A870; --c-violeta:#8E5AF2;
  --c-ambar:#E89A00; --c-ciano:#0AA5C2; --c-rosa:#E8468E; --c-cinza:#667085; --c-vermelho:#E5484D; --c-teal:#0E9384;
  --marca:#E5484D; --ac:var(--c-indigo);
  --okC:#0E9F6E; --okSup:#E3F8EF; --err:#D92D20; --errSup:#FFECEC; --errInk:#B42318; --warnC:#B45309; --warnSup:#FFF4DE;
  --sombra:0 1px 2px rgba(20,24,39,.04),0 4px 14px rgba(20,24,39,.05);
  --sombraM:0 18px 48px rgba(20,24,39,.18),0 2px 6px rgba(20,24,39,.05);
  --mola:cubic-bezier(.34,1.56,.64,1); --suave:cubic-bezier(.22,1,.36,1);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --lat:264px; --nav:0px;
  color-scheme:light;
}
:root[data-tema="escuro"]{
  --papel:#0D1017; --sup:#161B26; --sup2:#1C2230; --sup3:#252D3E;
  --ink:#EDF0F7; --ink2:#A3ABBE; --ink3:#737C95; --linha:#252C3B; --linhaF:#343D51;
  --okC:#5EE6A8; --okSup:#0F2A20; --err:#FF8A8A; --errSup:#34181A; --errInk:#FFB3B3; --warnC:#FBBF24; --warnSup:#33260C;
  --sombra:0 1px 2px rgba(0,0,0,.4); --sombraM:0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}
@media(prefers-color-scheme:dark){:root:not([data-tema="claro"]){
  --papel:#0D1017; --sup:#161B26; --sup2:#1C2230; --sup3:#252D3E;
  --ink:#EDF0F7; --ink2:#A3ABBE; --ink3:#737C95; --linha:#252C3B; --linhaF:#343D51;
  --okC:#5EE6A8; --okSup:#0F2A20; --err:#FF8A8A; --errSup:#34181A; --errInk:#FFB3B3; --warnC:#FBBF24; --warnSup:#33260C;
  --sombra:0 1px 2px rgba(0,0,0,.4); --sombraM:0 18px 48px rgba(0,0,0,.6);
  color-scheme:dark;
}}
/* cor da seção aberta */
body[data-aba="func"]{--ac:var(--c-azul)} body[data-aba="dia"]{--ac:var(--c-indigo)} body[data-aba="mensal"]{--ac:var(--c-violeta)}
body[data-aba="trocas"]{--ac:var(--c-ambar)} body[data-aba="banco"]{--ac:var(--c-teal)} body[data-aba="receb"]{--ac:var(--c-verde)}
body[data-aba="diverg"]{--ac:var(--c-laranja)} body[data-aba="validade"]{--ac:var(--c-rosa)} body[data-aba="config"]{--ac:var(--c-cinza)}

/* os tokens do app antigo passam a apontar para os do SOS (valem nos dois temas) */
body{
  --acSup:color-mix(in srgb,var(--ac) 11%,var(--sup)); --acLinha:color-mix(in srgb,var(--ac) 30%,var(--linha));
  --acInk:color-mix(in srgb,var(--ac) 72%,var(--ink)); --acBt:color-mix(in srgb,var(--ac) 86%,#000);
  --brand:var(--ac); --brand-strong:var(--acInk); --brand-dark:var(--acInk); --brand-soft:var(--acSup); --brand-line:var(--acLinha);
  --brand-solid:var(--acBt); --brand-solid-hover:color-mix(in srgb,var(--ac) 74%,#000); --on-brand:#fff;
  --info:color-mix(in srgb,var(--c-azul) 80%,var(--ink)); --info-soft:color-mix(in srgb,var(--c-azul) 10%,var(--sup)); --info-line:color-mix(in srgb,var(--c-azul) 28%,var(--linha));
  --muted:var(--ink2); --bg:var(--papel); --surface:var(--sup); --surface-2:var(--sup2);
  --line:var(--linha); --line-strong:var(--linhaF);
  --ok:var(--okC); --warn:var(--warnC); --warn-soft:var(--warnSup); --warn-line:color-mix(in srgb,var(--warnC) 30%,var(--linha));
  --danger:var(--err); --danger-soft:var(--errSup); --danger-line:color-mix(in srgb,var(--err) 30%,var(--linha)); --danger-ink:var(--errInk);
  --r1:10px; --r2:14px; --r3:22px; --r4:26px;
  --sh1:var(--sombra); --sh2:var(--sombra); --sh3:var(--sombraM);
  --ring:0 0 0 4px color-mix(in srgb,var(--ac) 18%,transparent);
  --scrim:rgba(13,16,23,.5);
}
:root[data-tema="escuro"] body{--acSup:color-mix(in srgb,var(--ac) 18%,var(--sup));--acInk:color-mix(in srgb,var(--ac) 62%,#fff);--on-brand:#fff}
@media(prefers-color-scheme:dark){:root:not([data-tema="claro"]) body{--acSup:color-mix(in srgb,var(--ac) 18%,var(--sup));--acInk:color-mix(in srgb,var(--ac) 62%,#fff)}}

body{font:15px/1.55 var(--sans);letter-spacing:0;background:var(--papel);color:var(--ink)}
:where(button,a,input,select,textarea,[tabindex]):focus-visible{outline:2px solid var(--ac);outline-offset:2px;border-radius:10px}

/* ---------- casca: barra lateral (computador) ---------- */
#lateral{position:fixed;inset:0 auto 0 0;width:var(--lat);background:var(--sup);border-right:1px solid var(--linha);display:flex;flex-direction:column;z-index:30;padding:20px 14px 12px}
.marca{display:flex;align-items:center;gap:11px;font-weight:750;font-size:17px;letter-spacing:-.02em;color:var(--ink);text-decoration:none;padding:0 6px 14px;line-height:1.2}
.marca .logo{width:38px;height:38px;border-radius:50%;background:var(--marca);color:#fff;display:grid;place-items:center;flex:0 0 auto;font-size:21px;box-shadow:0 6px 16px color-mix(in srgb,var(--marca) 35%,transparent)}
.marca small{display:block;font-size:11.5px;font-weight:500;color:var(--ink3);letter-spacing:0;margin-top:2px}
.navGrupo{color:var(--ink3);font-size:11px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;padding:12px 12px 6px}
#tabs{display:flex;flex-direction:column;gap:1px;overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px;background:none;border:0;position:static}
#tabs .aba{--c:var(--c-indigo);display:flex;align-items:center;gap:11px;border:0;background:none;color:var(--ink2);border-radius:999px;min-height:42px;padding:4px 12px 4px 4px;font:540 13.5px/1.25 var(--sans);cursor:pointer;text-align:left;width:100%;transition:background .2s,color .2s}
#tabs .aba>.ti{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;flex:0 0 auto;background:color-mix(in srgb,var(--c) 13%,transparent);color:var(--c);transition:transform .25s var(--mola),background .2s,color .2s}
#tabs .aba:hover{background:var(--sup2);color:var(--ink)}
#tabs .aba:hover>.ti{transform:scale(1.1) rotate(-6deg)}
#tabs .aba[aria-selected="true"]{background:color-mix(in srgb,var(--c) 12%,var(--sup));color:color-mix(in srgb,var(--c) 75%,var(--ink));font-weight:650}
#tabs .aba[aria-selected="true"]>.ti{background:var(--c);color:#fff;box-shadow:0 6px 14px color-mix(in srgb,var(--c) 40%,transparent)}
#tabs .aba span:not(.tab-badge){flex:1;min-width:0}
.tab-badge{flex:0 0 auto;margin-left:auto;background:var(--err);color:#fff;min-width:20px;height:20px;border-radius:999px;font-size:11px}
.pe{border-top:1px solid var(--linha);padding-top:8px;margin-top:8px;display:grid;grid-template-columns:1fr 1fr;gap:2px}
.btIco{display:inline-flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink2);border-radius:999px;padding:8px 10px;font:560 13px var(--sans);cursor:pointer;text-align:left;text-decoration:none}
.btIco:hover{background:var(--sup2);color:var(--ink)}
.btIco .ti{font-size:18px}
.pe .volta{grid-column:1/-1}

/* ---------- área de conteúdo ---------- */
main.wrap{margin-left:var(--lat);max-width:calc(1180px + var(--lat));padding:30px 40px 70px}
#pgTitulo{display:grid;grid-template-columns:auto 1fr;column-gap:16px;align-items:center;margin-bottom:22px}
#pgTitulo .selo{grid-row:span 2;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#fff;font-size:27px;box-shadow:0 10px 24px color-mix(in srgb,var(--ac) 35%,transparent);animation:popG .5s var(--mola) both}
#pgTitulo h1{grid-column:2;margin:0;font-size:27px;font-weight:750;letter-spacing:-.03em;line-height:1.2}
#pgTitulo p{grid-column:2;margin:3px 0 0;font-size:14px;color:var(--ink2)}
@keyframes popG{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes sobeG{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
main.wrap>section>.card{animation:sobeG .45s var(--suave) both}
main.wrap>section>.card:nth-child(2){animation-delay:.05s}main.wrap>section>.card:nth-child(3){animation-delay:.1s}main.wrap>section>.card:nth-child(n+4){animation-delay:.14s}

/* ---------- componentes do app antigo, no desenho do SOS ---------- */
.card{border-radius:var(--r4);padding:22px 24px;margin-bottom:18px;box-shadow:var(--sombra)}
.card h2{font-size:16px;font-weight:700;letter-spacing:-.01em;gap:10px;margin-bottom:6px}

.btn{border-radius:999px;font-weight:620;padding:10px 18px;transition:transform .15s var(--mola),box-shadow .2s,filter .2s,background .15s}
.btn-primary{background:var(--acBt);color:#fff;box-shadow:0 6px 16px color-mix(in srgb,var(--ac) 26%,transparent)}
.btn-primary:hover{background:var(--acBt);filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 10px 22px color-mix(in srgb,var(--ac) 32%,transparent)}
.btn-ghost{background:var(--sup);border-color:var(--linhaF)}
.btn-ghost:hover{background:var(--sup2);border-color:var(--ac)}
.btn-sm{border-radius:999px;padding:8px 14px}
.btn-icon{padding-left:11px;padding-right:11px}
input,select,textarea{border-radius:14px;border-width:1.5px}
.seg{border-radius:999px;border-width:1.5px;padding:3px;gap:2px}
.seg button{border-radius:999px;padding:8px 14px}
.seg button[aria-pressed="true"],.seg button.active{background:var(--acBt);color:#fff;box-shadow:0 4px 10px color-mix(in srgb,var(--ac) 28%,transparent)}

.drop:hover,.drop.over{background:var(--acSup);border-color:var(--ac)}
.emp{border-radius:18px;background:var(--sup);transition:border-color .2s,background .2s,transform .2s var(--mola),box-shadow .2s}
.emp:hover{transform:translateY(-2px);box-shadow:var(--sombra)}
.emp .av{border-radius:50%;background:var(--acBt);color:#fff;box-shadow:0 5px 12px color-mix(in srgb,var(--ac) 30%,transparent)}
.shift{border-radius:20px}

.stat{border-radius:20px;background:color-mix(in srgb,var(--ac) 7%,var(--sup));border-color:color-mix(in srgb,var(--ac) 16%,transparent);padding:14px 16px}

.rec-item{border-radius:16px;background:var(--sup)}
.modal{border-radius:26px;border:0}

.toast{border-radius:999px;box-shadow:var(--sombraM)}
.footer{color:var(--ink3)}

<script>
/* ================= util ================= */
const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
function uid(){return 'id'+Math.random().toString(36).slice(2,9)+(seq++);}
let seq=0;
/* Chaves que não puderam ser lidas (JSON corrompido). Enquanto houver alguma
   aqui, o app NÃO sobrescreve nada — antes perder a sessão que apagar o dado. */
const LS_RUIM={};
let LS_CHEIO=false;
function loadLS(k,f){
  let bruto=null;
  try{ bruto=localStorage.getItem(k); }catch(e){ return f; }
  if(bruto==null||bruto==='')return f;
  try{ const v=JSON.parse(bruto); return v==null?f:v; }
  catch(e){ LS_RUIM[k]=bruto; console.error('Conteúdo ilegível em '+k+' — preservado, não será sobrescrito.'); return f; }
}
function saveLS(k,o){
  if(LS_RUIM[k])return false;              // não sobrescreve dado que não conseguimos ler
  try{ localStorage.setItem(k,JSON.stringify(o)); return true; }
  catch(e){ LS_CHEIO=true; console.error('Falha ao salvar '+k,e); return false; }
}
function temDadoIlegivel(){ return Object.keys(LS_RUIM).length>0; }
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function norm(s){return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();}
function toast(msg,type){const el=document.createElement('div');el.className='toast '+(type||'');el.setAttribute('role','status');el.setAttribute('aria-live','polite');el.textContent=msg;document.body.appendChild(el);setTimeout(()=>el.remove(),3200);}
function initials(nm){const p=String(nm||'?').trim().split(/\s+/);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase();}

const DOW=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const DOW_S=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function pad2(n){return String(n).padStart(2,'0');}
function todayStr(){const d=new Date();return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());}
function parseDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');if(!m)return null;return new Date(+m[1],+m[2]-1,+m[3]);}
function weekdayOf(s){const d=parseDate(s);return d?d.getDay():null;}
function fmtDateBR(s){const d=parseDate(s);if(!d)return s;return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear();}
function fmtDateLong(s){const d=parseDate(s);if(!d)return s;return DOW[d.getDay()]+', '+pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear();}

/* ================= state ================= */
let FUNCS  = loadLS('fg_funcs',   []);
let TROCAS = loadLS('fg_trocas',  []);
let BANCO  = loadLS('fg_banco',   []);
let FERIAS = loadLS('fg_feriados',[]);
let TURNOS = loadLS('fg_turnos', [
  {id:'manha',nome:'Manhã',ini:'07:00',fim:'13:00'},
  {id:'tarde',nome:'Tarde',ini:'13:00',fim:'19:00'},
  {id:'noite',nome:'Noite',ini:'19:00',fim:'22:00'},
]);
let CATS = loadLS('fg_cats', [
  {id:'balconista',nome:'Balconista'},
  {id:'entregador',nome:'Entregador'},
  {id:'caixa',nome:'Operador de Caixa'},
]);
let MENSAL = loadLS('fg_mensal',  []); // escalas mensais importadas do Excel
let RECEB  = loadLS('fg_receb',   []); // itens a receber: {id,nome,dist,qtd,recebido,quando,obs,docId,nf}
let RECDOC = loadLS('fg_recdoc',  []); // documentos lidos: {id,arquivo,dist,nf,data,itens}
let DIVERG = loadLS('fg_diverg',  []); // divergências: {id,nf,produto,dist,qtd,motivo,nfDev,data,status,lote,ean}
let VALIDADE=loadLS('fg_validade',[]); // vencimentos: {id,nome,venc,qtd,lote,ean,dist,local,obs,resolvido}
let VALCFG  =loadLS('fg_valcfg',{dias:45,notificar:false,ultimoAviso:''});
let MINIMOS = loadLS('fg_minimos', {}); // MINIMOS[turnoId][catId] = n
function ensureMinimos(){
  TURNOS.forEach(t=>{ if(!MINIMOS[t.id])MINIMOS[t.id]={}; CATS.forEach(c=>{ if(MINIMOS[t.id][c.id]==null)MINIMOS[t.id][c.id]=1; }); });
}
ensureMinimos();
/* Fotografia do estado para poder voltar atrás. Guarda as 3 últimas versões
   com conteúdo, e sempre a última em que havia dados ("cheia"). */
const BAK_KEYS=['fg_bak1','fg_bak2','fg_bak3'];
function estadoAtual(){
  return {v:4,quando:new Date().toISOString(),funcs:FUNCS,trocas:TROCAS,banco:BANCO,ferias:FERIAS,
    turnos:TURNOS,cats:CATS,minimos:MINIMOS,receb:RECEB,recdoc:RECDOC,diverg:DIVERG,
    mensal:MENSAL,validade:VALIDADE,valcfg:VALCFG};
}
function contarRegistros(e){
  if(!e)return 0;
  return (e.funcs||[]).length+(e.trocas||[]).length+(e.banco||[]).length+(e.receb||[]).length
    +(e.diverg||[]).length+(e.validade||[]).length+(e.mensal||[]).length+(e.recdoc||[]).length+(e.ferias||[]).length;
}
function gravarBackup(){
  const atual=estadoAtual();
  if(contarRegistros(atual)===0)return;                       // nunca guarda backup vazio
  try{
    const b1=localStorage.getItem('fg_bak1');
    if(b1){ const b2=localStorage.getItem('fg_bak2'); if(b2)localStorage.setItem('fg_bak3',b2); localStorage.setItem('fg_bak2',b1); }
    localStorage.setItem('fg_bak1',JSON.stringify(atual));
    localStorage.setItem('fg_bak_cheio',JSON.stringify(atual));  // última versão COM dados
  }catch(e){ LS_CHEIO=true; }
}
let _ultimoTotal=null;
// quantos registros existiam no armazenamento quando o app abriu
function totalGuardado(){
  const d=lerBackup('fg_bak_cheio');
  return d?contarRegistros(d):0;
}
function saveAll(){
  const total=contarRegistros(estadoAtual());
  /* Risco real: o app abriu vazio (falha de leitura) e o primeiro save gravaria
     por cima do que estava salvo. Exclusão feita pelo usuário durante a sessão
     não cai aqui, porque aí já houve pelo menos um save antes. */
  if(total===0 && _ultimoTotal===null && totalGuardado()>0){
    console.error('Bloqueado: primeiro save da sessão está vazio, mas há '+totalGuardado()+' registro(s) guardado(s).');
    toast('Salvamento bloqueado: seus dados guardados não foram carregados. Vá em Configurações → Recuperação','err');
    return;
  }
  if(temDadoIlegivel()){
    console.error('Há dado ilegível no armazenamento; salvamento suspenso.');
    return;
  }
  _ultimoTotal=total;
  saveAllInterno();
  gravarBackup();
  if(!_recebendo&&window.MTS&&MTS.mudou)Object.keys(FG_COLS).forEach(c=>MTS.mudou(c));
}
function saveAllInterno(){
  saveLS('fg_funcs',FUNCS);saveLS('fg_trocas',TROCAS);saveLS('fg_banco',BANCO);
  saveLS('fg_feriados',FERIAS);saveLS('fg_turnos',TURNOS);saveLS('fg_cats',CATS);saveLS('fg_minimos',MINIMOS);
  saveLS('fg_receb',RECEB);saveLS('fg_recdoc',RECDOC);saveLS('fg_diverg',DIVERG);saveLS('fg_mensal',MENSAL);
  saveLS('fg_validade',VALIDADE);saveLS('fg_valcfg',VALCFG);
  if(LS_CHEIO)toast('O navegador recusou salvar (armazenamento cheio) — exporte um backup','err');
}
const catName=id=>{const c=CATS.find(c=>c.id===id);return c?c.nome:'Sem categoria';};
const turnoOf=id=>TURNOS.find(t=>t.id===id)||null;
const turnoName=id=>{const t=turnoOf(id);return t?t.nome:'—';};
const funcById=id=>FUNCS.find(f=>f.id===id)||null;
// cor por posição na lista: categoria criada pelo usuário também ganha cor própria
function catClass(id){ const i=CATS.findIndex(c=>c.id===id); return i<0?'gray':('c'+(i%6)); }

/* horários oficiais dos turnos (informados pelo usuário e conferidos com a
   legenda da planilha); usados quando o código do turno ainda não está cadastrado */
const HRANGE={
  H01:['06:50','14:40'], H02:['08:10','16:00'], H03:['10:10','18:00'], H04:['12:10','20:00'],
  H05:['13:10','21:00'], H06:['14:30','22:20'], H07:['15:30','23:20'],
  H08:['09:00','19:00'], H09:['09:30','19:20']
};
let bancoTipo='add';   // 'add' lança hora extra, 'sub' desconta

/* ================= banco de horas ================= */
function saldoFunc(fid){
  const f=funcById(fid); let s=(f&&+f.saldoInicial)||0;
  BANCO.filter(b=>b.funcId===fid).forEach(b=>{s+=(+b.horas||0);});
  return Math.round(s*100)/100;
}
function fmtH(n){ const v=Math.round((+n||0)*100)/100; return (v>0?'+':'')+v+'h'; }

/* ================= escala do dia ================= */
/* A escala mensal importada é a FONTE DA VERDADE: o horário de cada pessoa
   muda conforme o dia, então o turno do dia vem da grade do mês. O turno do
   cadastro só serve de reserva para datas sem escala importada. */
function mesDaData(dateStr){
  const d=parseDate(dateStr); if(!d)return null;
  return MENSAL.find(m=>m.mesNum===d.getMonth()&&m.ano===d.getFullYear())||null;
}
function linhaMensal(mes,f){
  if(!mes)return null;
  const alvo=norm(f.nome);
  return mes.funcs.find(x=>norm(x.nome)===alvo)
      || mes.funcs.find(x=>norm(x.nome).startsWith(alvo)||alvo.startsWith(norm(x.nome)))
      || null;
}
// horário de um código H0x: usa o turno cadastrado; se não existir, a tabela oficial
function horarioDoCodigo(cod){
  const t=TURNOS.find(t=>norm(t.nome)===norm(cod)||t.id===cod);
  if(t)return {turnoId:t.id,entrada:t.ini,saida:t.fim};
  const h=HRANGE[cod]||null;
  return {turnoId:cod,entrada:h?h[0]:'',saida:h?h[1]:''};
}
// o que a escala mensal diz para esta pessoa neste dia (null = mês não importado)
function escalaMensalDoDia(f,dateStr){
  const mes=mesDaData(dateStr); if(!mes)return null;
  const linha=linhaMensal(mes,f); if(!linha)return null;
  const d=parseDate(dateStr); const idx=d.getDate()-1;
  const cel=linha.dias[idx]; if(!cel)return null;
  const base={fonte:'mensal'};
  if(cel.t==='turno')  return Object.assign(base,{status:'trabalha'},horarioDoCodigo(cel.c),{cod:cel.c});
  if(cel.t==='domingo')return Object.assign(base,{status:'trabalha',motivo:'Domingo escalado'},horarioDoCodigo(''),{cod:'*',semHorario:true});
  if(cel.t==='folga')  return Object.assign(base,{status:'folga',motivo:'Folga'});
  if(cel.t==='ferias') return Object.assign(base,{status:'folga',motivo:'Férias'});
  if(cel.t==='feriado')return Object.assign(base,{status:'folga',motivo:'Folga de feriado'});
  if(cel.t==='aniv')   return Object.assign(base,{status:'folga',motivo:'Folga de aniversário'});
  return null; // dia em branco na planilha: cai no cadastro
}
// retorna {status:'trabalha'|'folga', turnoId, entrada, saida, motivo, trocaCom, trocaObs}
function baseSchedule(f,dateStr){
  const men=escalaMensalDoDia(f,dateStr);
  if(men){
    if(men.semHorario){ // '*' sem código de turno: mantém o horário habitual da pessoa
      const t=turnoOf(f.turnoId);
      return {status:'trabalha',motivo:men.motivo,fonte:'mensal',cod:'*',
              turnoId:f.turnoId,entrada:f.entrada||(t?t.ini:''),saida:f.saida||(t?t.fim:'')};
    }
    return men;
  }
  const wd=weekdayOf(dateStr);
  const isHol=FERIAS.some(h=>h.data===dateStr);
  const folgas=f.folgas||[];
  if(folgas.includes(wd)) return {status:'folga',motivo:'Folga semanal',turnoId:f.turnoId,entrada:f.entrada,saida:f.saida};
  if(isHol && f.folgaFeriado) return {status:'folga',motivo:'Folga de feriado',turnoId:f.turnoId,entrada:f.entrada,saida:f.saida};
  return {status:'trabalha',turnoId:f.turnoId,entrada:f.entrada,saida:f.saida};
}
function daySchedule(dateStr){
  const map={};
  FUNCS.forEach(f=>{ map[f.id]=baseSchedule(f,dateStr); });
  /* Troca por DIAS DIFERENTES: "trocou o dia 01 pelo dia 07".
     No dia de A, quem trabalha é B (com a escala que era de A) e A folga;
     no dia de B, o inverso. */
  TROCAS.filter(t=>t.cruzada).forEach(t=>{
    const ehDiaA=(t.datas||[]).includes(dateStr), ehDiaB=(t.datasB||[]).includes(dateStr);
    if(!ehDiaA&&!ehDiaB)return;
    const cede = ehDiaA ? t.aId : t.bId;          // quem estava escalado nesse dia
    const cobre= ehDiaA ? t.bId : t.aId;          // quem assume o dia
    const orig=map[cede], destino=map[cobre];
    if(!orig||!destino)return;
    map[cobre]={status:orig.status,turnoId:orig.turnoId,entrada:orig.entrada,saida:orig.saida,
      motivo:orig.motivo,cod:orig.cod,fonte:orig.fonte,
      trocaCom:cede,trocaObs:t.obs,trocaId:t.id,cruzada:true,assumiu:true,
      eraTurno:destino.turnoId,eraCod:destino.cod,eraStatus:destino.status,eraEntrada:destino.entrada,eraSaida:destino.saida,
      outroDia:(ehDiaA?(t.datasB||[])[0]:(t.datas||[])[0])};
    map[cede]={status:'folga',motivo:'Trocou este dia',turnoId:orig.turnoId,entrada:orig.entrada,saida:orig.saida,
      cod:orig.cod,fonte:orig.fonte,
      trocaCom:cobre,trocaObs:t.obs,trocaId:t.id,cruzada:true,assumiu:false,
      eraTurno:orig.turnoId,eraCod:orig.cod,eraStatus:orig.status,eraEntrada:orig.entrada,eraSaida:orig.saida,
      outroDia:(ehDiaA?(t.datasB||[])[0]:(t.datas||[])[0])};
  });
  // aplicar trocas de horário no MESMO dia (A e B invertem a escala entre si)
  TROCAS.filter(t=>!t.cruzada&&(t.datas||[]).includes(dateStr)).forEach(t=>{
    const a=map[t.aId], b=map[t.bId];
    if(!a||!b)return;
    const na={status:b.status,turnoId:b.turnoId,entrada:b.entrada,saida:b.saida,motivo:b.motivo,cod:b.cod,fonte:a.fonte,
              trocaCom:t.bId,trocaObs:t.obs,trocaId:t.id,eraTurno:a.turnoId,eraCod:a.cod,eraStatus:a.status,eraEntrada:a.entrada,eraSaida:a.saida};
    const nb={status:a.status,turnoId:a.turnoId,entrada:a.entrada,saida:a.saida,motivo:a.motivo,cod:a.cod,fonte:b.fonte,
              trocaCom:t.aId,trocaObs:t.obs,trocaId:t.id,eraTurno:b.turnoId,eraCod:b.cod,eraStatus:b.status,eraEntrada:b.entrada,eraSaida:b.saida};
    map[t.aId]=na; map[t.bId]=nb;
  });
  return map;
}
// alertas de mínimo por turno/categoria
function shortages(dateStr){
  const map=daySchedule(dateStr);
  const count={}; // count[turnoId][catId]
  TURNOS.forEach(t=>count[t.id]={});
  FUNCS.forEach(f=>{
    const s=map[f.id];
    if(s.status!=='trabalha')return;
    const tid=s.turnoId; if(!count[tid])count[tid]={};
    count[tid][f.catId]=(count[tid][f.catId]||0)+1;
  });
  const out=[];
  TURNOS.forEach(t=>CATS.forEach(c=>{
    const min=(MINIMOS[t.id]&&MINIMOS[t.id][c.id])||0;
    const have=(count[t.id]&&count[t.id][c.id])||0;
    if(min>0 && have<min) out.push({turno:t.nome,cat:c.nome,have,min,falta:min-have});
  }));
  return {out,count};
}

/* ================= navegação ================= */
let activeTab='dia';
const TABS=['dia','mensal','func','trocas','banco','receb','diverg','validade','config'];
const ABA_INFO={"dia": ["calendar-week", "Escala do dia", "Quem trabalha em cada turno, cobertura mínima e a semana"], "mensal": ["calendar-month", "Escala mensal", "A planilha do mês importada e a contagem de turnos"], "func": ["users", "Funcionários", "Equipe, função e turno habitual de cada pessoa"], "trocas": ["arrows-exchange", "Trocas", "Trocas de horário no mesmo dia ou de dias"], "banco": ["clock-hour-4", "Banco de horas", "Horas extras, descontos e saldo por pessoa"], "receb": ["package-import", "Recebimento", "Entrada de mercadoria: nota, pedido ou foto e conferência"], "diverg": ["file-alert", "Divergências", "Pendências de nota fiscal e devoluções"], "validade": ["calendar-exclamation", "Validade", "Produtos perto do vencimento"], "config": ["settings", "Configurações", "Turnos, categorias, feriados, backup e banco de teste"]};
function aoTrocarAba(name){
  document.body.dataset.aba=name;
  const inf=ABA_INFO[name]||['circle','',''];
  const pg=$('#pgTitulo'); if(pg){ pg.innerHTML='<span class="selo"><i class="ti ti-'+inf[0]+'" aria-hidden="true"></i></span><h1>'+esc(inf[1])+'</h1><p>'+esc(inf[2])+'</p>'; }
  $$('#barra button').forEach(b=>{ const on=b.dataset.b===name||(b.dataset.b==='mais'&&!['dia','receb','validade'].includes(name)); if(on)b.setAttribute('aria-current','true'); else b.removeAttribute('aria-current'); });
  document.title=(inf[1]?inf[1]+' · ':'')+'Gestão da farmácia';
  try{ localStorage.setItem('sos-gestao:aba',name); if(location.hash.slice(1)!==name)history.replaceState(null,'','#'+name); }catch(e){}
}
function selectTab(name,focus){
  activeTab=name;
  aoTrocarAba(name);
  $$('#tabs button').forEach(x=>{
    const on=x.dataset.tab===name;
    x.setAttribute('aria-selected',on?'true':'false');
    x.tabIndex=on?0:-1;
    if(on&&focus)x.focus();
  });
  TABS.forEach(t=>{ $('#tab-'+t).style.display = t===name?'':'none'; });
  render();
}
$$('#tabs button').forEach(b=>b.addEventListener('click',()=>selectTab(b.dataset.tab)));
// setas navegam entre abas (padrão de tablist)
$('#tabs').addEventListener('keydown',e=>{
  const k=e.key, i=TABS.indexOf(activeTab);
  let n=null;
  if(k==='ArrowRight'||k==='ArrowDown')n=(i+1)%TABS.length;
  else if(k==='ArrowLeft'||k==='ArrowUp')n=(i-1+TABS.length)%TABS.length;
  else if(k==='Home')n=0;
  else if(k==='End')n=TABS.length-1;
  if(n!==null){ e.preventDefault(); selectTab(TABS[n],true); }
});

/* ================= tema (mesma chave do SOS) ================= */
const TEMA_K='sos-farmacia:tema';
function temaSalvo(){ try{ return JSON.parse(localStorage.getItem(TEMA_K))||''; }catch(e){ return ''; } }
function escuroAgora(){ const t=temaSalvo(); return t==='escuro'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches); }
function applyTheme(){
  const t=temaSalvo();
  if(t)document.documentElement.dataset.tema=t; else delete document.documentElement.dataset.tema;
  const e=escuroAgora();
  $$('[data-tema-bt] .ti').forEach(i=>i.className='ti '+(e?'ti-sun':'ti-moon'));
}
function trocaTema(){ try{ localStorage.setItem(TEMA_K,JSON.stringify(escuroAgora()?'claro':'escuro')); }catch(e){} applyTheme(); }
applyTheme();
document.addEventListener('click',e=>{
  if(e.target.closest('[data-tema-bt]'))trocaTema();
  const ir=e.target.closest('[data-ir]'); if(ir)selectTab(ir.dataset.ir);
  const bb=e.target.closest('#barra [data-b]'); if(bb){ if(bb.dataset.b==='mais')gavetaMais(); else selectTab(bb.dataset.b); }
});
/* gaveta "Mais" do celular: todas as seções, voltar ao SOS e tema */
function gavetaMais(){
  const veu=document.createElement('div'); veu.className='veuG';
  const g=document.createElement('div'); g.className='gavetaG'; g.setAttribute('role','dialog'); g.setAttribute('aria-label','Mais seções');
  const fecha=()=>{ veu.remove(); g.remove(); };
  let html='<div class="puxa"></div>';
  [['Equipe',['dia','mensal','func','trocas','banco']],['Estoque',['receb','diverg','validade']],['Ajustes',['config']]].forEach(([nome,ids])=>{
    html+='<div class="navGrupo">'+nome+'</div>'+ids.map(id=>{ const b=$('#tb-'+id); const c=b?b.style.getPropertyValue('--c'):'';
      return '<button class="aba" type="button" data-g="'+id+'" style="--c:'+c+'"'+(activeTab===id?' aria-current="true"':'')+'><i class="ti ti-'+ABA_INFO[id][0]+'" aria-hidden="true"></i>'+esc(ABA_INFO[id][1])+'</button>'; }).join('');
  });
  html+='<div class="navGrupo">SOS</div><a class="aba" href="../" style="--c:var(--marca)"><i class="ti ti-arrow-left" aria-hidden="true"></i>Voltar ao SOS Farmácia</a>'
    +'<button class="aba" type="button" data-tema-bt style="--c:var(--c-cinza)"><i class="ti ti-moon" aria-hidden="true"></i>Claro ou escuro</button>';
  g.innerHTML=html;
  veu.onclick=fecha;
  g.addEventListener('click',e=>{ const b=e.target.closest('[data-g]'); if(b){ fecha(); selectTab(b.dataset.g); } else if(e.target.closest('a,[data-tema-bt]'))setTimeout(fecha,80); });
  document.addEventListener('keydown',function esc1(e){ if(e.key==='Escape'){ fecha(); document.removeEventListener('keydown',esc1); } });
  document.body.append(veu,g);
  applyTheme();
  const p=g.querySelector('[aria-current="true"]')||g.querySelector('.aba'); if(p)p.focus();
}

function falhaNaTela(e){

function recarregarLimpo(){
  const u=location.origin+location.pathname+'?v='+Date.now();

/* ================= modal ================= */
let _modalPrevFocus=null;
function openModal(title,icon,bodyHTML,footerHTML){
  const root=$('#modalRoot');
  _modalPrevFocus=document.activeElement;
  root.innerHTML='<div class="backdrop" id="bk"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle"><div class="mh"><h3 id="mTitle"><i class="ti '+icon+'" aria-hidden="true"></i> '+esc(title)+'</h3><button class="x" id="mx" type="button" aria-label="Fechar">&times;</button></div><div class="mb">'+bodyHTML+'</div>'+(footerHTML?('<div class="mf">'+footerHTML+'</div>'):'')+'</div></div>';
  $('#mx').onclick=closeModal;
  $('#bk').onclick=e=>{ if(e.target.id==='bk')closeModal(); };
  // foco entra no modal e fica preso nele enquanto aberto
  const foco=()=>$$('#modalRoot button,#modalRoot input,#modalRoot select,#modalRoot textarea,#modalRoot a[href]').filter(el=>!el.disabled&&el.offsetParent!==null);
  // nunca começa num botão destrutivo — o foco cai no primeiro campo/ação segura
  const cands=foco().filter(el=>el.id!=='mx'&&!el.classList.contains('btn-danger'));
  const alvo=cands[0]||$('#mx'); if(alvo)alvo.focus();
  $('#modalRoot').onkeydown=e=>{
    if(e.key==='Escape'){ e.preventDefault(); closeModal(); return; }
    if(e.key!=='Tab')return;
    const f=foco(); if(!f.length)return;
    const primeiro=f[0], ultimo=f[f.length-1];
    if(e.shiftKey && document.activeElement===primeiro){ e.preventDefault(); ultimo.focus(); }
    else if(!e.shiftKey && document.activeElement===ultimo){ e.preventDefault(); primeiro.focus(); }
  };
}
function closeModal(){
  $('#modalRoot').innerHTML=''; $('#modalRoot').onkeydown=null;
  if(_modalPrevFocus&&document.contains(_modalPrevFocus))_modalPrevFocus.focus();
  _modalPrevFocus=null;
}

  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f)handleImport(f); });

}

function downloadModelo(){
  const aoa=[
    ['Nome','Categoria','Turno','Entrada','Saída','Folga semanal','Hora extra','Folga feriado'],
    ['Maria Silva','Balconista','Manhã','07:00','13:00','Domingo','Não','Sim'],
    ['João Souza','Entregador','Tarde','13:00','19:00','Segunda','Sim','Não'],
    ['Ana Costa','Operador de Caixa','Noite','19:00','22:00','Quarta, Domingo','Não','Sim'],
  ];
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  ws['!cols']=[{wch:20},{wch:18},{wch:10},{wch:10},{wch:10},{wch:18},{wch:11},{wch:12}];
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Escala');
  XLSX.writeFile(wb,'modelo-escala-farmacia.xlsx');
}
function readWorkbook(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    const isCsv=/\.csv$/i.test(file.name);
    r.onload=()=>{ try{
      const wb = isCsv ? XLSX.read(r.result,{type:'string'}) : XLSX.read(new Uint8Array(r.result),{type:'array'});
      const sh = wb.Sheets[wb.SheetNames[0]];
      res(XLSX.utils.sheet_to_json(sh,{header:1,raw:true,defval:''}));
    }catch(e){rej(e);} };
    r.onerror=rej;
    if(isCsv)r.readAsText(file); else r.readAsArrayBuffer(file);
  });
}
function excelTimeToStr(v){
  if(v==null||v==='')return '';
  if(typeof v==='number'){
    if(v>0&&v<1){ const mins=Math.round(v*24*60); return pad2(Math.floor(mins/60))+':'+pad2(mins%60); }
    if(v>=100&&v<=2359){ return pad2(Math.floor(v/100))+':'+pad2(v%100); }
    if(v>=0&&v<=23)return pad2(v)+':00';
    return String(v);
  }
  const m=/(\d{1,2})\s*[:hH]\s*(\d{0,2})/.exec(String(v));
  if(m)return pad2(+m[1])+':'+pad2(+(m[2]||0));
  return String(v).trim();
}
function mapCatValue(v){
  const s=norm(v);
  if(!s)return '';
  if(/balcon|balcao/.test(s))return 'balconista';
  if(/entreg|motoboy|motoqueir|deliver|motoc/.test(s))return 'entregador';
  if(/caixa|operador de caixa|frente de caixa/.test(s))return 'caixa';
  const c=CATS.find(c=>norm(c.nome)===s||c.id===s); return c?c.id:'';
}
function mapTurnoValue(v){
  const s=norm(v);
  if(/manh|matut/.test(s))return TURNOS.find(t=>t.id==='manha')?.id||TURNOS[0]?.id;
  if(/tarde|vesper/.test(s))return TURNOS.find(t=>t.id==='tarde')?.id||TURNOS[0]?.id;
  if(/noit|notur/.test(s))return TURNOS.find(t=>t.id==='noite')?.id||TURNOS[0]?.id;
  const t=TURNOS.find(t=>norm(t.nome)===s||t.id===s); return t?t.id:'';
}
function mapDays(v){
  const s=norm(v); if(!s)return [];
  const out=new Set();
  const keys=[['dom',0],['seg',1],['ter',2],['qua',3],['qui',4],['sex',5],['sab',6]];
  s.split(/[,;\/e]| e |\s+/).map(x=>x.trim()).filter(Boolean).forEach(tok=>{
    if(/^\d$/.test(tok)){const n=+tok;if(n>=0&&n<=6)out.add(n);return;}
    for(const [k,i] of keys){ if(tok.startsWith(k)){out.add(i);return;} }
  });
  // texto contínuo
  keys.forEach(([k,i])=>{ if(s.includes(k))out.add(i); });
  return Array.from(out).sort();
}
function mapBool(v){ const s=norm(v); return /^(sim|s|x|1|true|verdadeiro|yes|y)$/.test(s)||/\bsim\b/.test(s); }

const FIELD_DEFS=[
  {key:'nome',label:'Nome',re:/nome|funcion|colaborad|servidor/},
  {key:'categoria',label:'Categoria',re:/categ|fun[cç][aã]o|cargo|setor|funcao/},
  {key:'turno',label:'Turno',re:/turno|per[ií]odo|periodo|escala/},
  {key:'entrada',label:'Entrada',re:/entrada|in[ií]cio|inicio|começa|comeca/},
  {key:'saida',label:'Saída',re:/sa[ií]da|saida|fim|t[eé]rmino|termino|termina/},
  {key:'folga',label:'Folga semanal',re:/folga|descanso|day ?off|dsr/},
  {key:'horaextra',label:'Hora extra',re:/hora ?extra|\bextra/},
  {key:'feriado',label:'Folga feriado',re:/feriado|folga.*feriad/},
];
async function handleImport(file){
  let rows;
  try{ rows=await readWorkbook(file); }
  catch(e){ toast('Não consegui ler o arquivo','err'); return; }
  rows=(rows||[]).filter(r=>r&&r.some(c=>String(c).trim()!==''));
  if(rows.length<1){ toast('Planilha vazia','err'); return; }
  // achar linha de cabeçalho (a que tem 'nome' ou a com mais texto)
  let hIdx=0,best=-1;
  for(let i=0;i<Math.min(rows.length,6);i++){
    const cells=rows[i].map(c=>norm(c));
    const hasNome=cells.some(c=>/nome|funcion|colaborad/.test(c));
    const score=cells.filter(c=>c&&/[a-z]/.test(c)).length + (hasNome?10:0);
    if(score>best){best=score;hIdx=i;}
  }
  const header=rows[hIdx].map(c=>String(c).trim());
  const data=rows.slice(hIdx+1).filter(r=>r.some(c=>String(c).trim()!==''));
  // guesses
  const guess={};
  FIELD_DEFS.forEach(fd=>{
    let idx=header.findIndex(h=>fd.re.test(norm(h)));
    guess[fd.key]= idx>=0? idx : -1;
  });
  openImportMapper(header,data,guess,file.name);
}
function openImportMapper(header,data,guess,fname){
  const colOpts=(sel)=>'<option value="-1">— nenhuma —</option>'+header.map((h,i)=>'<option value="'+i+'"'+(i===sel?' selected':'')+'>'+esc(h||('Coluna '+(i+1)))+'</option>').join('');
  let mapRows=FIELD_DEFS.map(fd=>'<tr><td style="font-weight:600">'+fd.label+(fd.key==='nome'?' *':'')+'</td><td><select class="mapSel" data-key="'+fd.key+'">'+colOpts(guess[fd.key])+'</select></td></tr>').join('');
  let body='<p class="hint" style="margin-top:0">Arquivo <b>'+esc(fname)+'</b> — '+data.length+' linha(s). Confira o mapeamento das colunas. Categoria, turno, dias e sim/não são reconhecidos automaticamente.</p>'
    +'<div class="tbl-wrap"><table class="mini-tbl"><thead><tr><th>Campo do app</th><th>Coluna da planilha</th></tr></thead><tbody>'+mapRows+'</tbody></table></div>'
    +'<div style="margin-top:14px"><label class="switch"><input type="checkbox" id="impUpsert" checked> Atualizar funcionários com o mesmo nome (evita duplicados)</label></div>'
    +'<div id="impPreview" style="margin-top:12px"></div>';
  const footer='<button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button><button class="btn btn-primary btn-sm" id="impGo"><i class="ti ti-download"></i> Importar</button>';
  openModal('Importar escala','ti-file-spreadsheet',body,footer);
  function buildRecords(){
    const m={}; $$('.mapSel').forEach(s=>m[s.dataset.key]=+s.value);
    const recs=[];
    data.forEach(r=>{
      const get=k=> m[k]>=0? r[m[k]] : '';
      const nome=String(get('nome')||'').trim();
      if(!nome)return;
      const turnoId=mapTurnoValue(get('turno'))||TURNOS[0]?.id||'';
      const t=turnoOf(turnoId);
      recs.push({
        nome,
        catId:mapCatValue(get('categoria')),
        turnoId,
        entrada:excelTimeToStr(get('entrada'))|| (t?t.ini:''),
        saida:excelTimeToStr(get('saida'))|| (t?t.fim:''),
        folgas:mapDays(get('folga')),
        horaExtra:mapBool(get('horaextra')),
        folgaFeriado:mapBool(get('feriado')),
        saldoInicial:0,
      });
    });
    return recs;
  }
  function refreshPreview(){
    const recs=buildRecords();
    let h='<div class="alert info"><i class="ti ti-eye"></i> Pré-visualização: '+recs.length+' funcionário(s) serão importados.</div>';
    if(recs.length){
      h+='<div class="tbl-wrap"><table class="mini-tbl"><thead><tr><th>Nome</th><th>Categoria</th><th>Turno</th><th>Horário</th><th>Folga</th><th>H.Extra</th><th>Fer.</th></tr></thead><tbody>';
      recs.slice(0,8).forEach(x=>{
        h+='<tr><td>'+esc(x.nome)+'</td><td>'+(x.catId?esc(catName(x.catId)):'<span class="muted">?</span>')+'</td><td>'+esc(turnoName(x.turnoId))+'</td><td>'+esc(x.entrada)+'–'+esc(x.saida)+'</td><td>'+esc(folgasLabel(x.folgas).replace('Sem folga fixa','—'))+'</td><td>'+(x.horaExtra?'Sim':'—')+'</td><td>'+(x.folgaFeriado?'Sim':'—')+'</td></tr>';
      });
      h+='</tbody></table></div>';
      if(recs.length>8)h+='<div class="muted" style="font-size:12px;margin-top:6px">… e mais '+(recs.length-8)+' linha(s).</div>';
    }
    $('#impPreview').innerHTML=h;
  }
  $$('.mapSel').forEach(s=>s.onchange=refreshPreview);
  refreshPreview();
  $('#impGo').onclick=()=>{
    const recs=buildRecords();
    if(!recs.length){toast('Nada para importar','err');return;}
    const upsert=$('#impUpsert').checked;
    let add=0,upd=0;
    recs.forEach(rec=>{
      const ex= upsert ? FUNCS.find(f=>norm(f.nome)===norm(rec.nome)) : null;
      if(ex){ rec.saldoInicial=ex.saldoInicial||0; Object.assign(ex,rec); ex.id=ex.id||uid(); upd++; }
      else { rec.id=uid(); FUNCS.push(rec); add++; }
    });
    saveAll();closeModal();render();
    toast(add+' adicionado(s), '+upd+' atualizado(s)','ok');
  };
}

    html+='<div style="margin-top:6px;font-weight:700;font-size:15px">Semana de '+esc(fmtDateBR(ini))+' a '+esc(fmtDateBR(shiftDay(ini,6)))+'</div></div>';
    el.innerHTML=html+cardSemana(ini);
    $$('.wday',el).forEach(b=>b.onclick=()=>{ diaSel=b.dataset.d; vistaDia='dia'; renderDia(); });
  }else{
    const isHol=FERIAS.find(h=>h.data===diaSel);
    html+='<div style="margin-top:6px;font-weight:700;font-size:15px">'+esc(fmtDateLong(diaSel))

      +resumoDia(diaSel)+'</div>';

  }

  $('#vDia').onclick=()=>{ vistaDia='dia'; renderDia(); };
  $('#vSem').onclick=()=>{ vistaDia='semana'; renderDia(); };
  $('#diaInput').onchange=e=>{ diaSel=e.target.value||todayStr(); renderDia(); };

  $('#diaPrev').onclick=()=>{ diaSel=shiftDay(diaSel,-passo); renderDia(); };
  $('#diaNext').onclick=()=>{ diaSel=shiftDay(diaSel,passo); renderDia(); };
  $('#diaPrint').onclick=()=>window.print();
}

/* ---------- detalhe da troca (o '*' na escala do dia) ---------- */
function detalheTroca(funcId,dia){
  const f=funcById(funcId); if(!f)return;
  const s=daySchedule(dia)[funcId]; if(!s||!s.trocaCom)return;
  const o=funcById(s.trocaCom);
  const tr=TROCAS.find(t=>t.id===s.trocaId)||null;
  const desc=x=>x.status==='folga'?('Folga'+(x.motivo?' ('+x.motivo+')':'')):((x.cod?x.cod+' · ':'')+(x.entrada||'—')+' – '+(x.saida||'—'));
  const antes=desc({status:s.eraStatus,cod:s.eraCod,entrada:s.eraEntrada,saida:s.eraSaida,motivo:s.motivo});
  const agora=desc(s);
  let b='<div class="alert info"><i class="ti ti-arrows-exchange" aria-hidden="true"></i><div>'
    +'<b>'+esc(f.nome)+'</b> trocou com <b>'+esc(o?o.nome:'?')+'</b> em '+esc(fmtDateLong(dia))+'.'
    +(s.cruzada&&s.outroDia?'<br>Troca de dias: este dia por <b>'+esc(fmtDateBR(s.outroDia))+'</b>.':'')+'</div></div>';
  if(s.cruzada){
    b+='<div class="kv"><span class="k">Neste dia</span><span class="v">'
      +(s.assumiu?('Cobrindo '+esc(o?o.nome.split(' ')[0]:'?')+' — '+esc(agora)):'Folga (dia cedido)')+'</span></div>'
      +'<div class="kv"><span class="k">Escala que seria sua</span><span class="v">'+esc(antes)+'</span></div>'
      +'<div class="kv"><span class="k">Dia trocado</span><span class="v">'+esc(s.outroDia?fmtDateBR(s.outroDia):'—')+'</span></div>';
  }else{
    b+='<div class="kv"><span class="k">Escala original</span><span class="v">'+esc(antes)+'</span></div>'
      +'<div class="kv"><span class="k">Passou a fazer</span><span class="v">'+esc(agora)+'</span></div>';
  }
  b+='<div class="kv"><span class="k">Trocou com</span><span class="v">'+esc(o?o.nome:'?')+'</span></div>';
  if(tr&&(tr.datas||[]).length>1)
    b+='<div class="kv"><span class="k">Dias desta troca</span><span class="v">'+tr.datas.slice().sort().map(fmtDateBR).join(' · ')+'</span></div>';
  if(s.trocaObs)b+='<div class="kv"><span class="k">Observação</span><span class="v">'+esc(s.trocaObs)+'</span></div>';
  openModal('Troca do dia','ti-arrows-exchange',b,
    '<button class="btn btn-ghost btn-sm" type="button" onclick="closeModal()">Fechar</button>'
    +'<button class="btn btn-ghost btn-sm" type="button" id="trIr"><i class="ti ti-external-link" aria-hidden="true"></i> Ver em Trocas</button>');
  $('#trIr').onclick=()=>{ closeModal(); selectTab('trocas'); };
}

/* ---------- resumo do dia: quatro números que respondem "como está hoje?" ---------- */
function resumoDia(dia){
  if(!FUNCS.length)return '';
  const map=daySchedule(dia);
  const trab=FUNCS.filter(f=>map[f.id].status==='trabalha').length;
  const folga=FUNCS.length-trab;
  const falta=shortages(dia).out.reduce((s,o)=>s+o.falta,0);
  const trocas=TROCAS.filter(t=>(t.datas||[]).includes(dia)||(t.datasB||[]).includes(dia)).length;
  return '<div class="stats">'
    +'<div class="stat good"><div class="v">'+trab+'</div><div class="k"><i class="ti ti-user-check" aria-hidden="true"></i> Trabalhando</div></div>'
    +'<div class="stat"><div class="v">'+folga+'</div><div class="k"><i class="ti ti-bed" aria-hidden="true"></i> De folga</div></div>'
    +'<div class="stat'+(falta?' bad':'')+'"><div class="v">'+falta+'</div><div class="k"><i class="ti ti-alert-triangle" aria-hidden="true"></i> Faltando</div></div>'
    +'<div class="stat"><div class="v">'+trocas+'</div><div class="k"><i class="ti ti-arrows-exchange" aria-hidden="true"></i> Trocas</div></div>'
    +'</div>';
}

/* ---------- visão de semana: onde estão os buracos, de relance ---------- */
function inicioSemana(s){ const d=parseDate(s)||new Date(); d.setDate(d.getDate()-d.getDay()); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function cardSemana(ini){
  if(!FUNCS.length)return '<div class="card"><div class="empty"><i class="ti ti-calendar-off" aria-hidden="true"></i>Cadastre funcionários para ver a escala da semana.</div></div>';
  const hoje=todayStr();
  let h='<div class="card"><h2><i class="ti ti-layout-grid" aria-hidden="true"></i> Semana inteira</h2>'
    +'<p class="hint">Quantas pessoas por turno em cada dia. Toque num dia para abrir a escala completa dele.</p>'
    +'<div class="tbl-wrap" style="border:none;padding-bottom:2px"><div class="week">';
  for(let i=0;i<7;i++){
    const d=shiftDay(ini,i);
    const map=daySchedule(d);
    const falta=shortages(d).out.reduce((s,o)=>s+o.falta,0);
    const hol=FERIAS.find(x=>x.data===d);
    const wd=weekdayOf(d);
    h+='<button type="button" class="wday" data-d="'+d+'"'+(d===hoje?' aria-current="date"':'')
      +' aria-label="'+esc(fmtDateLong(d))+(falta?' — faltam '+falta+' pessoa(s)':' — cobertura completa')+'">'
      +'<div class="wd">'+DOW_S[wd]+(d===hoje?' · hoje':'')+'</div>'
      +'<div class="dt">'+esc(fmtDateBR(d).slice(0,5))+'</div>';
    TURNOS.forEach(t=>{
      const n=FUNCS.filter(f=>map[f.id].status==='trabalha'&&map[f.id].turnoId===t.id).length;
      h+='<div class="wrow"><span class="wl">'+esc(t.nome)+'</span><span class="wv'+(n===0?' neg-num':'')+'">'+n+'</span></div>';
    });
    if(falta)h+='<div class="wflag miss"><i class="ti ti-alert-triangle" aria-hidden="true"></i> faltam '+falta+'</div>';
    if(hol)h+='<div class="wflag hol"><i class="ti ti-confetti" aria-hidden="true"></i> '+esc(hol.nome)+'</div>';
    h+='</button>';
  }
  return h+'</div></div></div>';
}

/* ---------- vista de um dia ---------- */
function cardsDoDia(dia){
  const map=daySchedule(dia);
  const {out,count}=shortages(dia);
  let html='';

  if(FUNCS.length){
    // matriz turno × categoria: dá pra ver ONDE falta, não só que falta
    html+='<div class="card"><h2><i class="ti ti-shield-check" aria-hidden="true"></i> Cobertura mínima</h2>';
    html+=out.length===0
      ? '<div class="alert ok"><i class="ti ti-circle-check" aria-hidden="true"></i> Todas as categorias atingem o mínimo em todos os turnos neste dia.</div>'
      : '<div class="alert danger"><i class="ti ti-alert-triangle-filled" aria-hidden="true"></i><div><b>Desfalque em '+out.length+' ponto(s)</b> — as células em vermelho abaixo mostram onde reforçar.</div></div>';
    html+='<div class="tbl-wrap"><table class="cov"><caption class="sr-only">Pessoas escaladas por turno e categoria, comparadas ao mínimo exigido</caption>'
      +'<thead><tr><th scope="col">Turno</th>'+CATS.map(c=>'<th scope="col">'+esc(c.nome)+'</th>').join('')+'</tr></thead><tbody>';
    TURNOS.forEach(t=>{
      html+='<tr><th scope="row" style="font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink)">'+esc(t.nome)
        +'<br><span class="muted num" style="font-size:11.5px;font-weight:600">'+esc(t.ini)+'–'+esc(t.fim)+'</span></th>';
      CATS.forEach(c=>{
        const min=(MINIMOS[t.id]&&MINIMOS[t.id][c.id])||0;
        const have=(count[t.id]&&count[t.id][c.id])||0;
        const falta=min>0&&have<min;
        html+='<td class="cell '+(falta?'miss':(min>0?'ok':''))+'">'
          +(falta?'<i class="ti ti-alert-triangle" aria-hidden="true"></i>':(min>0?'<i class="ti ti-check" aria-hidden="true"></i>':''))
          +have+(min>0?'<span class="muted" style="font-weight:600">/'+min+'</span>':'')
          +(falta?'<div style="font-size:10.5px;font-weight:700">faltam '+(min-have)+'</div>':'')+'</td>';
      });
      html+='</tr>';
    });
    html+='</tbody></table></div><p class="hint" style="margin:10px 0 0">Formato: escalados / mínimo. Ajuste os mínimos em Configurações.</p></div>';
  }

  if(FUNCS.length===0){
    return '<div class="card"><div class="empty"><i class="ti ti-calendar-off" aria-hidden="true"></i>Cadastre funcionários para ver a escala do dia.</div></div>';
  }

  // escalados por turno
  html+='<div class="card"><h2><i class="ti ti-list-check" aria-hidden="true"></i> Escalados para trabalhar</h2>';
  TURNOS.forEach(t=>{
    const working=FUNCS.filter(f=>map[f.id].status==='trabalha'&&map[f.id].turnoId===t.id)
      .sort((a,b)=>a.catId.localeCompare(b.catId)||a.nome.localeCompare(b.nome));
    html+='<div class="shift"><div class="head"><b><i class="ti ti-clock-hour-9" aria-hidden="true"></i> '+esc(t.nome)+'</b><span class="time">'+esc(t.ini)+' – '+esc(t.fim)+' · '+working.length+' pessoa(s)</span></div><div class="body">';
    if(working.length===0){ html+='<div class="line"><span class="muted">Ninguém escalado neste turno.</span></div>'; }
    else working.forEach(f=>{
      const s=map[f.id];
      let badges='<span class="tag '+catClass(f.catId)+'">'+esc(catName(f.catId))+'</span>';
      if(f.horaExtra)badges+=' <span class="tag extra"><i class="ti ti-clock-plus" aria-hidden="true"></i> H.extra</span>';
      if(s.cod&&s.fonte==='mensal')badges+=' <span class="tag gray">'+esc(s.cod)+'</span>';
      // '*' marca a troca no dia; clicar abre o detalhe
      const marca=s.trocaCom?'<button type="button" class="troca-mark" data-f="'+f.id+'" data-d="'+dia+'" aria-label="Ver detalhes da troca de '+esc(f.nome)+'" title="Trocado neste dia — toque para ver">*</button>':'';
      html+='<div class="line"><span class="nm">'+esc(f.nome)+marca+'</span><span class="hr">'+esc(s.entrada||'—')+' – '+esc(s.saida||'—')+'</span></div><div style="padding:0 0 8px"><div class="chips">'+badges+'</div></div>';
    });
    html+='</div></div>';
  });
  html+='</div>';

  // folgas
  const off=FUNCS.filter(f=>map[f.id].status==='folga').sort((a,b)=>a.nome.localeCompare(b.nome));
  html+='<div class="card"><h2><i class="ti ti-bed" aria-hidden="true"></i> De folga <span class="tag gray">'+off.length+'</span></h2>';
  if(off.length===0)html+='<div class="muted" style="font-size:13.5px">Ninguém de folga.</div>';
  else{ html+='<div class="chips">'; off.forEach(f=>{ const s=map[f.id];
    const marca=s.trocaCom?'<button type="button" class="troca-mark" data-f="'+f.id+'" data-d="'+dia+'" aria-label="Ver detalhes da troca de '+esc(f.nome)+'" title="Trocado neste dia — toque para ver">*</button>':'';
    html+='<span class="tag folga">'+esc(f.nome)+' · '+esc(s.motivo||'Folga')+'</span>'+marca; }); html+='</div>'; }
  html+='</div>';

  // trocas do dia
  const td=TROCAS.filter(t=>(t.datas||[]).includes(dia)||(t.datasB||[]).includes(dia));
  if(td.length){
    html+='<div class="card"><h2><i class="ti ti-arrows-exchange" aria-hidden="true"></i> Trocas neste dia</h2>';
    td.forEach(t=>{ const a=funcById(t.aId),b=funcById(t.bId);
      let txt='<b>'+esc(a?a.nome:'?')+'</b> ⇄ <b>'+esc(b?b.nome:'?')+'</b>';
      if(t.cruzada){
        const ehA=(t.datas||[]).includes(dia);
        const cede=ehA?a:b, cobre=ehA?b:a, outro=ehA?(t.datasB||[])[0]:(t.datas||[])[0];
        txt='<b>'+esc(cobre?cobre.nome:'?')+'</b> cobre <b>'+esc(cede?cede.nome:'?')+'</b> hoje'
           +(outro?' — em troca do dia <b>'+esc(fmtDateBR(outro))+'</b>':'');
      }
      html+='<div class="alert warn"><i class="ti ti-arrows-exchange" aria-hidden="true"></i><div>'+txt+(t.obs?' — '+esc(t.obs):'')+'</div></div>'; });
    html+='</div>';
  }
  return html;
}
function shiftDay(s,delta){ const d=parseDate(s)||new Date(); d.setDate(d.getDate()+delta); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }

/* ============================================================
   ABA: TROCAS
   ============================================================ */
function renderTrocas(){
  const el=$('#tab-trocas');
  let html='<div class="card"><h2><i class="ti ti-arrows-exchange"></i> Registrar troca de horário</h2>'
    +'<p class="hint">Dois tipos: <b>mesmo dia</b> (os dois trocam o horário entre si naquele dia) ou <b>dias diferentes</b> (ex.: o Funcionário 1 trocou o dia 01 pelo dia 07 com o Funcionário 2 — quem estava escalado folga e o outro cobre). A escala do dia se ajusta sozinha.</p>';
  if(FUNCS.length<2){
    html+='<div class="empty"><i class="ti ti-users"></i>Cadastre pelo menos 2 funcionários para registrar trocas.</div></div>';
    el.innerHTML=html; return;
  }
  const opts=FUNCS.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(f=>'<option value="'+f.id+'">'+esc(f.nome)+' ('+esc(catName(f.catId))+')</option>').join('');
  html+='<div class="seg" role="group" aria-label="Tipo de troca" style="margin-bottom:14px">'
    +'<button type="button" id="trTipoMesmo" aria-pressed="'+(trocaCruzada?'false':'true')+'">Mesmo dia</button>'
    +'<button type="button" id="trTipoCruz" aria-pressed="'+(trocaCruzada?'true':'false')+'">Dias diferentes</button></div>'
    +'<div class="two"><div class="f-wrap"><label class="f" for="trA">Funcionário 1</label><select id="trA">'+opts+'</select></div>'
    +'<div class="f-wrap"><label class="f" for="trB">Funcionário 2</label><select id="trB">'+opts+'</select></div></div>'
    +'<div class="f-wrap" style="margin-top:12px"><label class="f" for="trObs">Observação (opcional)</label><input id="trObs" placeholder="ex.: consulta médica"></div>'
    +'<div class="f-wrap" style="margin-top:12px"><label class="f" for="trData">'+(trocaCruzada?'Dia(s) do Funcionário 1 (que ele deixa de fazer)':'Dias da troca')+'</label>'
    +'<div class="inline-add"><div class="f-wrap"><input type="date" id="trData" value="'+diaSel+'"></div>'
    +'<button class="btn btn-ghost btn-sm" id="trAddData" type="button"><i class="ti ti-plus" aria-hidden="true"></i> Adicionar dia</button></div>'
    +'<div class="chips" id="trDatas" style="margin-top:10px"></div></div>'
    +(trocaCruzada?('<div class="f-wrap" style="margin-top:12px"><label class="f" for="trDataB">Dia(s) do Funcionário 2 (que ele deixa de fazer)</label>'
      +'<div class="inline-add"><div class="f-wrap"><input type="date" id="trDataB" value="'+diaSel+'"></div>'
      +'<button class="btn btn-ghost btn-sm" id="trAddDataB" type="button"><i class="ti ti-plus" aria-hidden="true"></i> Adicionar dia</button></div>'
      +'<div class="chips" id="trDatasB" style="margin-top:10px"></div></div>'):'')
    +'<div class="row-actions"><button class="btn btn-primary btn-sm" id="trSave" type="button"><i class="ti ti-check" aria-hidden="true"></i> Salvar troca</button></div></div>';

  // lista
  html+='<div class="card"><h2><i class="ti ti-history"></i> Trocas registradas <span class="tag gray">'+TROCAS.length+'</span></h2>';
  if(TROCAS.length===0)html+='<div class="empty"><i class="ti ti-arrows-exchange"></i>Nenhuma troca registrada.</div>';
  else{
    const sorted=TROCAS.slice().sort((a,b)=>(b.datas[0]||'').localeCompare(a.datas[0]||''));
    html+='<div class="tbl-wrap"><table><thead><tr><th>Funcionários</th><th>Dias</th><th>Obs</th><th></th></tr></thead><tbody>';
    sorted.forEach(t=>{ const a=funcById(t.aId),b=funcById(t.bId);
      const dias = t.cruzada
        ? '<span class="tag gray">'+esc((a?a.nome.split(' ')[0]:'?'))+': '+(t.datas||[]).map(fmtDateBR).join(', ')+'</span> '
          +'<span class="tag troca"><i class="ti ti-arrows-exchange" aria-hidden="true"></i> por</span> '
          +'<span class="tag gray">'+esc((b?b.nome.split(' ')[0]:'?'))+': '+(t.datasB||[]).map(fmtDateBR).join(', ')+'</span>'
        : (t.datas||[]).map(d=>'<span class="tag gray">'+fmtDateBR(d)+'</span>').join(' ');
      html+='<tr><td><b>'+esc(a?a.nome:'?')+'</b> ⇄ <b>'+esc(b?b.nome:'?')+'</b>'
        +(t.cruzada?'<br><span class="muted" style="font-size:11.5px">troca de dias</span>':'')+'</td>'
        +'<td>'+dias+'</td><td class="muted">'+esc(t.obs||'')+'</td>'
        +'<td style="text-align:right"><button class="btn btn-danger btn-sm trDel" type="button" data-id="'+t.id+'" aria-label="Remover troca de '+esc(a?a.nome:'?')+' com '+esc(b?b.nome:'?')+'"><i class="ti ti-trash" aria-hidden="true"></i></button></td></tr>';
    });
    html+='</tbody></table></div>';
  }
  html+='</div>';
  el.innerHTML=html;

  // form state
  let datas=[], datasB=[];
  const pinta=(arr,alvo,cls)=>{
    const el=$(alvo); if(!el)return;
    el.innerHTML = arr.length ? arr.map((d,i)=>'<span class="tag">'+fmtDateBR(d)+' <button data-i="'+i+'" class="'+cls+'" aria-label="Remover '+fmtDateBR(d)+'" style="background:none;border:none;color:inherit;cursor:pointer;font-weight:800">×</button></span>').join('')
      : '<span class="muted" style="font-size:12.5px">Nenhum dia adicionado ainda.</span>';
    $$('.'+cls).forEach(b=>b.onclick=()=>{ arr.splice(+b.dataset.i,1); pinta(arr,alvo,cls); });
  };
  const renderDatas=()=>{ pinta(datas,'#trDatas','rmData'); if(trocaCruzada)pinta(datasB,'#trDatasB','rmDataB'); };
  renderDatas();
  $('#trTipoMesmo').onclick=()=>{ trocaCruzada=false; renderTrocas(); };
  $('#trTipoCruz').onclick=()=>{ trocaCruzada=true; renderTrocas(); };
  $('#trAddData').onclick=()=>{ const v=$('#trData').value; if(!v)return; if(!datas.includes(v))datas.push(v); datas.sort(); renderDatas(); };
  if($('#trAddDataB'))$('#trAddDataB').onclick=()=>{ const v=$('#trDataB').value; if(!v)return; if(!datasB.includes(v))datasB.push(v); datasB.sort(); renderDatas(); };
  $('#trSave').onclick=()=>{
    const aId=$('#trA').value,bId=$('#trB').value;
    if(aId===bId){toast('Escolha dois funcionários diferentes','err');return;}
    if(!datas.length){ const v=$('#trData').value; if(v)datas.push(v); }
    if(!datas.length){toast('Adicione ao menos um dia','err');return;}
    if(trocaCruzada){
      if(!datasB.length){ const v=($('#trDataB')||{}).value; if(v)datasB.push(v); }
      if(!datasB.length){toast('Adicione o dia do Funcionário 2','err');return;}
      const repetido=datas.find(d=>datasB.includes(d));
      if(repetido){toast('O dia '+fmtDateBR(repetido)+' está nos dois lados — use "Mesmo dia"','err');return;}
      TROCAS.push({id:uid(),aId,bId,cruzada:true,datas:datas.slice(),datasB:datasB.slice(),obs:$('#trObs').value.trim()});
    }else{
      TROCAS.push({id:uid(),aId,bId,datas:datas.slice(),obs:$('#trObs').value.trim()});
    }
    saveAll();render();toast('Troca registrada','ok');
  };
  $$('.trDel').forEach(b=>b.onclick=()=>{ if(confirm('Remover esta troca?')){ TROCAS=TROCAS.filter(t=>t.id!==b.dataset.id); saveAll();render(); } });
}

  const opts=FUNCS.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(f=>'<option value="'+f.id+'">'+esc(f.nome)+'</option>').join('');

  // saldos
