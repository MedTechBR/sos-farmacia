/* ============================================================
   ABA: ESCALA MENSAL (importada do Excel do usuário)
   Lê a planilha no formato dele — matriz funcionário × dia, com
   turnos H01..H09, F (folga), * (domingo trabalhado), FÉRIAS
   (soletrado em verde) e FF/FA. Detecta cada situação pelo
   CONTEÚDO (o SheetJS não lê cor de célula; verificamos que o
   conteúdo reproduz a cor exatamente). No fim, conta quantas
   vezes cada funcionário fez cada turno.
   ============================================================ */
let buscaMen='', mesSelId=null;

// horários padrão (mensagem do usuário + legenda da planilha); usados só para exibição
const HTIMES={
  H01:'06:50–14:40', H02:'08:10–16:00', H03:'10:10–18:00', H04:'12:10–20:00',
  H05:'13:10–21:00', H06:'14:30–22:20', H07:'15:30–23:20',
  H08:'09:00–13:00 / 15:00–19:00', H09:'09:30–19:20'
};
const MESES_PT=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DOW_LETRA={0:'D',1:'S',2:'T',3:'Q',4:'Q',5:'S',6:'S'}; // referência

function readWorkbookAll(file){
  return new Promise((res,rej)=>{
    const r=new FileReader(), isCsv=/\.csv$/i.test(file.name);
    r.onload=()=>{ try{
      const wb = isCsv ? XLSX.read(r.result,{type:'string'}) : XLSX.read(new Uint8Array(r.result),{type:'array'});
      const out={};
      wb.SheetNames.forEach(n=>{ out[n]=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}); });
      res({names:wb.SheetNames,sheets:out});
    }catch(e){rej(e);} };
    r.onerror=rej;
    if(isCsv)r.readAsText(file); else r.readAsArrayBuffer(file);
  });
}

const FLET=new Set(['F','E','R','I','A','S']);
function ehTurno(v){ return /^H\d{1,2}$/.test(v); }

// classifica os códigos de um funcionário (array de strings cruas dos dias)
function classificarDias(raw){
  const up=raw.map(v=>String(v==null?'':v).trim().toUpperCase());
  // marca blocos de FÉRIAS: sequência (>=3) de células com 1 letra ∈ {F,E,R,I,A,S}
  const fer=up.map(()=>false);
  let i=0;
  while(i<up.length){
    if(up[i].length===1 && FLET.has(up[i])){
      let j=i; while(j<up.length && up[j].length===1 && FLET.has(up[j])) j++;
      if(j-i>=3){ for(let k=i;k<j;k++) fer[k]=true; }
      i=j;
    } else i++;
  }
  return up.map((v,idx)=>{
    if(fer[idx]) return {c:'FÉRIAS',t:'ferias'};
    if(ehTurno(v)) return {c:v,t:'turno'};
    if(v==='*')   return {c:'*',t:'domingo'};
    if(v==='FF')  return {c:'FF',t:'feriado'};
    if(v==='FA')  return {c:'FA',t:'aniv'};
    if(v==='F')   return {c:'F',t:'folga'};
    if(v==='')    return {c:'',t:'vazio'};
    return {c:v,t:'outro'};
  });
}

// acha a linha dos números dos dias (a que tem mais inteiros 1..31 em sequência)
function acharLinhaDias(rows){
  let melhor=-1, melhorScore=0, melhorCols=null;
  for(let r=0;r<Math.min(rows.length,8);r++){
    const cols=[];
    (rows[r]||[]).forEach((v,c)=>{
      const n=parseInt(String(v).trim(),10);
      if(String(v).trim()!=='' && n>=1 && n<=31 && String(parseInt(String(v).trim(),10))===String(v).trim()) cols.push({col:c,n});
    });
    if(cols.length>melhorScore){ melhorScore=cols.length; melhor=r; melhorCols=cols; }
  }
  return melhorScore>=10 ? {row:melhor,cols:melhorCols} : null;
}

function parseEscalaMensal(rows,nomeArq){
  const diaInfo=acharLinhaDias(rows);
  if(!diaInfo) throw new Error('Não encontrei a linha com os dias do mês (1, 2, 3…). Confira se escolheu a aba certa.');
  const dayCols=diaInfo.cols;                 // [{col,n}]
  const colIdxs=dayCols.map(d=>d.col);
  const nomeCol=Math.max(0,Math.min.apply(null,colIdxs)-1); // coluna do nome = imediatamente antes dos dias
  const funcCol=Math.max(0,nomeCol-1);

  // título / mês
  let titulo='', mesNum=null;
  for(let r=0;r<=diaInfo.row;r++){
    const linha=(rows[r]||[]).map(x=>String(x).trim()).join(' ');
    const mnorm=norm(linha);
    if(mnorm.indexOf('escala')>=0 || MESES_PT.some(m=>mnorm.indexOf(m)>=0)){
      MESES_PT.forEach((m,idx)=>{ if(mnorm.indexOf(m)>=0 && mesNum===null) mesNum=idx; });
      if(!titulo) titulo=linha.replace(/\s+/g,' ').trim();
    }
  }
  // linha dos dias da semana (logo abaixo dos números), se houver
  const dowRow=rows[diaInfo.row+1]||[];
  const dias=dayCols.map(d=>{
    let dw=String(dowRow[d.col]||'').trim().toUpperCase();
    return {n:d.n, dow:dw};
  });

  // funcionários
  const funcs=[]; let funcAtual='';
  for(let r=diaInfo.row+2;r<rows.length;r++){
    const row=rows[r]||[];
    const fcell=String(row[funcCol]||'').trim();
    const nome=String(row[nomeCol]||'').trim();
    if(fcell) funcAtual=fcell;
    if(!nome) continue;
    if(nome.indexOf('=')>=0) break;                       // início da legenda (F = FOLGA…)
    if(/^H\d{1,2}\b/.test(nome.toUpperCase())) break;     // legenda de horários
    if(!/[A-Za-zÀ-ÿ]{3,}/.test(nome)) continue;           // descarta números soltos
    const raw=dayCols.map(d=>row[d.col]);
    const preenchidas=raw.filter(v=>String(v==null?'':v).trim()!=='').length;
    if(preenchidas<5) continue;
    funcs.push({func:funcAtual===nome?'':funcAtual, nome, dias:classificarDias(raw)});
  }
  if(!funcs.length) throw new Error('Não encontrei funcionários com escala nesta aba.');
  return {titulo:titulo||nomeArq, mesNum, dias, funcs, fonte:nomeArq};
}

// soma por turno de um funcionário
function tallyFunc(f){
  const t={}; let folga=0,domingo=0,ferias=0,feriado=0,aniv=0,outro=0,trab=0;
  f.dias.forEach(d=>{
    if(d.t==='turno'){ t[d.c]=(t[d.c]||0)+1; trab++; }
    else if(d.t==='folga')folga++;
    else if(d.t==='domingo'){domingo++;trab++;}
    else if(d.t==='ferias')ferias++;
    else if(d.t==='feriado')feriado++;
    else if(d.t==='aniv')aniv++;
    else if(d.t==='outro')outro++;
  });
  return {turnos:t,folga,domingo,ferias,feriado,aniv,outro,trab};
}
// união ordenada dos códigos de turno de um mês
function turnosDoMes(mes){
  const s=new Set();
  mes.funcs.forEach(f=>f.dias.forEach(d=>{ if(d.t==='turno')s.add(d.c); }));
  return Array.from(s).sort();
}

/* ---------- importação: escolher aba → confirmar → salvar ---------- */
async function importarEscalaMensal(file){
  const prog=modalProgresso('Lendo '+file.name);
  let wbAll;
  try{ wbAll=await readWorkbookAll(file); }
  catch(e){ closeModal(); toast('Não consegui abrir o Excel','err'); return; }
  closeModal();
  // qual aba? tenta achar a que parece escala do mês; senão deixa escolher
  const candidatas=wbAll.names.filter(n=>{
    try{ const p=parseEscalaMensal(wbAll.sheets[n],file.name); return p.funcs.length>0; }catch(e){ return false; }
  });
  const escolher=(nome)=>{
    let p; try{ p=parseEscalaMensal(wbAll.sheets[nome],file.name); }
    catch(e){ toast(e.message,'err'); return; }
    confirmarEscalaMensal(p,file.name);
  };
  if(candidatas.length===1){ escolher(candidatas[0]); return; }
  const lista=(candidatas.length?candidatas:wbAll.names);
  const preferida=candidatas.find(n=>{ const mn=norm(n); return MESES_PT.some((m,i)=>mn.indexOf(m.slice(0,3))>=0); })||lista[0];
  openModal('Escolher a aba do mês','ti-table',
    '<p class="hint" style="margin-top:0">O arquivo tem várias abas. Escolha a do mês que você quer importar.</p>'
    +'<div class="f-wrap"><label class="f" for="abaSel">Aba</label><select id="abaSel">'
    +lista.map(n=>'<option'+(n===preferida?' selected':'')+'>'+esc(n)+'</option>').join('')+'</select></div>'
    +(candidatas.length?'<p class="hint" style="margin:10px 0 0">Abas que parecem escala já vêm filtradas.</p>':''),
    '<button class="btn btn-ghost btn-sm" type="button" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary btn-sm" id="abaOk" type="button"><i class="ti ti-arrow-right" aria-hidden="true"></i> Ler aba</button>');
  $('#abaOk').onclick=()=>{ const n=$('#abaSel').value; closeModal(); escolher(n); };
}

function confirmarEscalaMensal(p,arq){
  const anoAtual=+todayStr().slice(0,4);
  const totDias=p.funcs.length?p.funcs[0].dias.length:0;
  let body='<p class="hint" style="margin-top:0">Li <b>'+p.funcs.length+'</b> funcionário(s) e <b>'+totDias+'</b> dia(s) em <b>'+esc(arq)+'</b>. Confira o mês antes de salvar.</p>'
    +'<div class="two"><div class="f-wrap"><label class="f" for="menMes">Mês</label><select id="menMes">'
    +MESES_PT.map((m,i)=>'<option value="'+i+'"'+(i===p.mesNum?' selected':'')+'>'+m.charAt(0).toUpperCase()+m.slice(1)+'</option>').join('')+'</select></div>'
    +'<div class="f-wrap"><label class="f" for="menAno">Ano</label><input id="menAno" type="number" value="'+anoAtual+'" min="2020" max="2100"></div></div>'
    +'<div class="tbl-wrap" style="margin-top:14px;max-height:34vh;overflow:auto"><table class="mini-tbl"><thead><tr><th>Função</th><th>Nome</th><th>Dias lidos</th></tr></thead><tbody>'
    +p.funcs.map(f=>'<tr><td>'+esc(f.func||'—')+'</td><td>'+esc(f.nome)+'</td><td class="num">'+f.dias.filter(d=>d.t!=='vazio').length+'</td></tr>').join('')
    +'</tbody></table></div>';
  openModal('Confirmar importação','ti-calendar-check',body,
    '<button class="btn btn-ghost btn-sm" type="button" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary btn-sm" id="menOk" type="button"><i class="ti ti-check" aria-hidden="true"></i> Importar</button>');
  $('#menOk').onclick=()=>{
    const mesNum=+$('#menMes').value, ano=+$('#menAno').value||anoAtual;
    const nome=MESES_PT[mesNum].charAt(0).toUpperCase()+MESES_PT[mesNum].slice(1)+'/'+ano;
    // substitui mesmo mês/ano já importado
    MENSAL=MENSAL.filter(m=>!(m.mesNum===mesNum&&m.ano===ano));
    const id=uid();
    MENSAL.push({id,nome,mesNum,ano,fonte:arq,titulo:p.titulo,dias:p.dias,funcs:p.funcs,criadoEm:todayStr()});
    // a grade pode usar turnos ainda não cadastrados (ex.: H04, H09) — sem eles,
    // quem for escalado nesse turno não apareceria na Escala do dia
    const novos=ensureTurnosDasEscalas();
    mesSelId=id; buscaMen='';
    saveAll(); closeModal(); selectTab('mensal');
    toast('Escala de '+nome+' importada'+(novos?' · '+novos+' turno(s) criado(s)':''),'ok');
  };
}

/* ---------- cadastrar os funcionários da planilha no app ----------
   Cria as categorias (função da planilha), os turnos H01..H09 com os
   horários oficiais e um funcionário por linha, usando o turno em que
   a pessoa mais trabalhou no mês como turno padrão. Não duplica: quem
   já existe é atualizado. */
function catIdPorNome(nome){
  const alvo=norm(nome);
  let c=CATS.find(c=>norm(c.nome)===alvo);
  if(c)return c.id;
  // singular do rótulo da planilha: "BALCONISTAS" -> "Balconista"
  let bonito=nome.trim().toLowerCase().replace(/^\w/,ch=>ch.toUpperCase());
  if(/s$/i.test(bonito)&&bonito.length>3)bonito=bonito.replace(/es$/i,'').replace(/s$/i,'');
  c=CATS.find(c=>norm(c.nome)===norm(bonito));
  if(c)return c.id;
  const id=uid(); CATS.push({id,nome:bonito});
  TURNOS.forEach(t=>{ if(!MINIMOS[t.id])MINIMOS[t.id]={}; MINIMOS[t.id][id]=0; });
  return id;
}
function turnoIdPorCodigo(cod){
  let t=TURNOS.find(t=>norm(t.nome)===norm(cod)||t.id===cod);
  if(t)return t.id;
  const h=HRANGE[cod]||['00:00','00:00'];
  const id=cod; TURNOS.push({id,nome:cod,ini:h[0],fim:h[1]});
  // turno novo nasce sem exigência de cobertura: quem define o mínimo é o usuário,
  // senão a Escala diária acusaria desfalque em todo turno recém-criado
  MINIMOS[id]={}; CATS.forEach(c=>{ MINIMOS[id][c.id]=0; });
  return id;
}
// dia da semana em que a pessoa mais folga (só vira folga fixa se for padrão claro)
function folgasFixas(f,mes,ano){
  const cont={};
  f.dias.forEach((d,i)=>{
    if(d.t!=='folga')return;
    const wd=new Date(ano,mes,i+1).getDay();
    cont[wd]=(cont[wd]||0)+1;
  });
  const out=[];
  Object.keys(cont).forEach(wd=>{ if(cont[wd]>=3)out.push(+wd); });  // 3+ vezes no mesmo dia = fixo
  return out;
}
function cadastrarFuncsDoMes(mes){
  // turno mais usado por função — serve de padrão para quem passou o mês de férias
  const porFuncao={};
  mes.funcs.forEach(f=>{
    const t=tallyFunc(f), k=f.func||'';
    porFuncao[k]=porFuncao[k]||{};
    Object.keys(t.turnos).forEach(c=>{ porFuncao[k][c]=(porFuncao[k][c]||0)+t.turnos[c]; });
  });
  const maisUsado=k=>{ const o=porFuncao[k]||{}; return Object.keys(o).sort((a,b)=>o[b]-o[a])[0]||''; };
  const prev=[];
  mes.funcs.forEach(f=>{
    const t=tallyFunc(f);
    const cods=Object.keys(t.turnos).sort((a,b)=>t.turnos[b]-t.turnos[a]);
    const principal=cods[0]||maisUsado(f.func||'');
    const existe=FUNCS.find(x=>norm(x.nome)===norm(f.nome));
    prev.push({f,t,principal,folgas:folgasFixas(f,mes.mesNum,mes.ano),existe:!!existe});
  });
  const novos=prev.filter(p=>!p.existe).length, atualiza=prev.length-novos;
  let body='<p class="hint" style="margin-top:0">De <b>'+esc(mes.nome)+'</b>: <b>'+novos+'</b> funcionário(s) novo(s)'
    +(atualiza?' e <b>'+atualiza+'</b> já cadastrado(s) que serão atualizados':'')+'.</p>'
    +'<p class="hint" style="margin:0 0 12px">O <b>turno padrão</b> é aquele em que a pessoa mais trabalhou no mês. A <b>folga fixa</b> só é marcada quando cai no mesmo dia da semana pelo menos 3 vezes — na sua escala a folga é rodiziada, então é normal ficar em branco.</p>'
    +'<div class="tbl-wrap scroll-y" style="max-height:40vh"><table class="mini-tbl"><thead><tr>'
    +'<th style="width:34px"><span class="sr-only">Incluir</span></th><th>Nome</th><th>Função</th><th>Turno padrão</th><th>Folga fixa</th></tr></thead><tbody>';
  prev.forEach((p,i)=>{
    body+='<tr><td><input type="checkbox" class="cdUsar" data-i="'+i+'" checked aria-label="Cadastrar '+esc(p.f.nome)+'"></td>'
      +'<td>'+esc(p.f.nome)+(p.existe?' <span class="tag gray">já existe</span>':'')+'</td>'
      +'<td>'+esc(p.f.func||'—')+'</td>'
      +'<td>'+(p.principal?esc(p.principal)+' <span class="muted">'+(HTIMES[p.principal]||'')+'</span>'
          +(Object.keys(p.t.turnos).length?'':' <span class="tag gray">de férias — turno da função</span>')
        :'<span class="muted">—</span>')+'</td>'
      +'<td>'+(p.folgas.length?p.folgas.map(d=>DOW_S[d]).join(', '):'<span class="muted">—</span>')+'</td></tr>';
  });
  body+='</tbody></table></div>';
  openModal('Cadastrar funcionários','ti-user-plus',body,
    '<button class="btn btn-ghost btn-sm" type="button" onclick="closeModal()">Cancelar</button>'
    +'<button class="btn btn-primary btn-sm" id="cdOk" type="button"><i class="ti ti-check" aria-hidden="true"></i> Cadastrar</button>');
  $('#cdOk').onclick=()=>{
    let criados=0,atualizados=0;
    $$('.cdUsar').forEach(c=>{
      if(!c.checked)return;
      const p=prev[+c.dataset.i];
      const catId=p.f.func?catIdPorNome(p.f.func):(CATS[0]?CATS[0].id:catIdPorNome('Geral'));
      const turnoId=p.principal?turnoIdPorCodigo(p.principal):(TURNOS[0]?TURNOS[0].id:turnoIdPorCodigo('H01'));
      const t=turnoOf(turnoId)||{ini:'',fim:''};
      const ja=FUNCS.find(x=>norm(x.nome)===norm(p.f.nome));
      if(ja){
        ja.catId=catId; ja.turnoId=turnoId; ja.entrada=t.ini; ja.saida=t.fim;
        if(p.folgas.length)ja.folgas=p.folgas.slice();
        atualizados++;
      }else{
        FUNCS.push({id:uid(),nome:p.f.nome,catId,turnoId,entrada:t.ini,saida:t.fim,
          folgas:p.folgas.slice(),horaExtra:false,folgaFeriado:false,saldoInicial:0});
        criados++;
      }
    });
    if(!criados&&!atualizados){ toast('Ninguém selecionado','err'); return; }
    ensureMinimos(); saveAll();
    // turnos antigos que ninguém usa mais só atrapalham a cobertura mínima
    const orfaos=TURNOS.filter(t=>!FUNCS.some(f=>f.turnoId===t.id));
    if(orfaos.length&&TURNOS.length>orfaos.length&&
       confirm('Cadastro concluído.\n\nSobrou(ram) '+orfaos.length+' turno(s) que ninguém usa ('+orfaos.map(t=>t.nome).join(', ')+').\n\nRemover?')){
      orfaos.forEach(t=>{ delete MINIMOS[t.id]; });
      TURNOS=TURNOS.filter(t=>FUNCS.some(f=>f.turnoId===t.id));
      saveAll();
    }
    closeModal(); selectTab('func');
    toast(criados+' cadastrado(s)'+(atualizados?' · '+atualizados+' atualizado(s)':''),'ok');
  };
}

// garante que todo turno usado pelas escalas importadas exista no cadastro
function ensureTurnosDasEscalas(){
  let novos=0;
  MENSAL.forEach(mes=>{
    turnosDoMes(mes).forEach(cod=>{
      if(TURNOS.some(t=>norm(t.nome)===norm(cod)||t.id===cod))return;
      const h=HRANGE[cod]||['00:00','00:00'];
      TURNOS.push({id:cod,nome:cod,ini:h[0],fim:h[1]});
      MINIMOS[cod]={}; CATS.forEach(c=>{ MINIMOS[cod][c.id]=0; });
      novos++;
    });
  });
  if(novos)saveAll();
  return novos;
}

function ligarDropMensal(){
  const drop=$('#menDrop'), file=$('#menFile');
  if(!drop)return;
  drop.onclick=()=>file.click();
  drop.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); file.click(); } };
  file.onchange=e=>{ if(e.target.files[0])importarEscalaMensal(e.target.files[0]); file.value=''; };
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f)importarEscalaMensal(f); });
}

function carregarScript(src){
  return new Promise((ok,err)=>{
    if(document.querySelector('script[data-src="'+src+'"]')){ ok(); return; }
    const s=document.createElement('script'); s.src=src; s.setAttribute('data-src',src);
    s.onload=()=>ok(); s.onerror=()=>err(new Error('Não consegui carregar o leitor ('+src.split('/').pop()+'). Verifique a conexão.'));
    document.head.appendChild(s);
  });
}

/* ---------- extração por tipo de arquivo ---------- */
async function textoDoPDF(file,prog){
  const base='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/';
  prog('Carregando o leitor de PDF…');
  await carregarScript(base+'pdf.min.js');
  pdfjsLib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let txt='';
  for(let i=1;i<=pdf.numPages;i++){
    prog('Lendo página '+i+' de '+pdf.numPages+'…');
    const c=await (await pdf.getPage(i)).getTextContent();
    const linhas={};
    c.items.forEach(it=>{ const y=Math.round(it.transform[5]); (linhas[y]=linhas[y]||[]).push(it.str); });
    txt+=Object.keys(linhas).map(Number).sort((a,b)=>b-a).map(y=>linhas[y].join(' ')).join('\n')+'\n';
  }
  return txt;
}
/* Foto de nota vem com sombra e iluminação irregular — é o que mais faz o
   OCR perder quantidade. A correção que se mostrou melhor nos testes foi
   dividir cada pixel pela iluminação local (janela grande, que estima o
   fundo sem apagar a letra). Testado contra a alternativa de ampliar e de
   binarizar: ambas PIORARAM o reconhecimento, então não são usadas. */
function corrigirIluminacao(file){
  return new Promise((ok,err)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      URL.revokeObjectURL(url);
      const w=img.width, h=img.height;
      if(!w||!h){ err(new Error('Imagem sem conteúdo.')); return; }
      const c=document.createElement('canvas'); c.width=w; c.height=h;
      const x=c.getContext('2d',{willReadFrequently:true});
      x.drawImage(img,0,0);
      const d=x.getImageData(0,0,w,h), px=d.data, g=new Float32Array(w*h);
      for(let i=0,j=0;i<px.length;i+=4,j++) g[j]=0.299*px[i]+0.587*px[i+1]+0.114*px[i+2];
      // soma acumulada (integral image) para média local em tempo constante
      const S=new Float64Array((w+1)*(h+1));
      for(let y=0;y<h;y++){ let lin=0;
        for(let xx=0;xx<w;xx++){ lin+=g[y*w+xx]; S[(y+1)*(w+1)+(xx+1)]=S[y*(w+1)+(xx+1)]+lin; } }
      const r=Math.max(20,Math.round(Math.min(w,h)/3));   // janela grande = iluminação, não a letra
      for(let y=0;y<h;y++){
        const y0=Math.max(0,y-r), y1=Math.min(h-1,y+r);
        for(let xx=0;xx<w;xx++){
          const x0=Math.max(0,xx-r), x1=Math.min(w-1,xx+r);
          const area=(x1-x0+1)*(y1-y0+1);
          const soma=S[(y1+1)*(w+1)+(x1+1)]-S[y0*(w+1)+(x1+1)]-S[(y1+1)*(w+1)+x0]+S[y0*(w+1)+x0];
          const fundo=Math.max(1,soma/area), v=g[y*w+xx];
          const out=Math.max(0,Math.min(255, 255*(v/fundo)*0.92 ));
          const i=(y*w+xx)*4; px[i]=px[i+1]=px[i+2]=out; px[i+3]=255;
        }
      }
      x.putImageData(d,0,0);
      c.toBlob(b=>b?ok(b):err(new Error('Falha ao preparar a imagem.')),'image/png');
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); err(new Error('Não consegui abrir a imagem.')); };
    img.src=url;
  });
}
async function textoDaImagem(file,prog){
  prog('Carregando o leitor de imagem…');
  await carregarScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  const log=m=>{
    if(m.status==='recognizing text')prog('Lendo a imagem… '+Math.round((m.progress||0)*100)+'%');
    else if(String(m.status).indexOf('traineddata')>=0)prog('Baixando o idioma português (só na primeira vez)…');
  };
  prog('Corrigindo a iluminação da foto…');
  let tratada=null;
  try{ tratada=await corrigirIluminacao(file); }catch(e){ /* segue com a original */ }
  let txt=tratada ? ((await Tesseract.recognize(tratada,'por',{logger:log})).data.text||'') : '';
  // se o tratamento não rendeu, tenta a foto como veio (algumas já vêm boas)
  if(txt.replace(/\s/g,'').length<20){
    prog('Tentando a foto original…');
    const r2=await Tesseract.recognize(file,'por',{logger:log});
    if(((r2.data.text||'').replace(/\s/g,'').length)>txt.replace(/\s/g,'').length) txt=r2.data.text||txt;
  }
  return txt;
}
/* Planilha de pedido: em vez de adivinhar linha a linha, procura as colunas
   (produto / quantidade / distribuidora) pelo cabeçalho. */
function itensDaPlanilha(rows){
  rows=(rows||[]).filter(r=>r&&r.some(c=>String(c==null?'':c).trim()!==''));
  if(!rows.length)return null;
  const val=(r,c)=>String((r&&r[c])==null?'':r[c]).trim();
  // "Item" costuma ser o número da linha, não o produto: pesa menos que "Produto/Descrição"
  const notaRotulo=t=>{
    const n=norm(t);
    if(/(produto|descri|mercadoria|medicament|material)/.test(n))return 10;
    if(/(nome|especifica)/.test(n))return 6;
    if(/item/.test(n))return 3;
    return 0;
  };
  const RE_QTD=/(qtd|quant|volume|caixas|unid|pecas|pçs)/i;
  const RE_DIST=/(distribuidor|fornecedor|laborat|emitente|empresa)/i;
  const RE_NF=/(nota|nf\b|nfe|documento)/i;

  let melhor=null;
  for(let i=0;i<Math.min(rows.length,12);i++){
    const cels=(rows[i]||[]).map(c=>String(c==null?'':c).trim());
    const corpo=rows.slice(i+1);
    if(corpo.length<1)continue;
    cels.forEach((rot,c)=>{
      const base=notaRotulo(rot);
      if(!base)return;
      // a coluna de produto tem que ter TEXTO de verdade abaixo (não números da coluna "Item")
      let comTexto=0,total=0;
      corpo.forEach(r=>{ const v=val(r,c); if(!v)return; total++; if(/[A-Za-zÀ-ÿ]{3,}/.test(v))comTexto++; });
      if(!total)return;
      const prop=comTexto/total;
      if(prop<0.5)return;
      const score=base*10+prop*10+Math.min(total,20)*0.1;
      if(!melhor||score>melhor.score)melhor={score,hIdx:i,cProd:c,cels};
    });
    if(melhor&&melhor.hIdx===i&&melhor.score>=100)break;   // achou coluna de produto explícita
  }

  const itens=[];
  if(melhor){
    const {hIdx,cProd,cels}=melhor;
    const cQtd=cels.findIndex(c=>RE_QTD.test(c));
    const cDist=cels.findIndex(c=>RE_DIST.test(c));
    const cNF=cels.findIndex(c=>RE_NF.test(c));
    for(let i=hIdx+1;i<rows.length;i++){
      const r=rows[i];
      const nome=val(r,cProd);
      if(!nome||!/[A-Za-zÀ-ÿ]{3,}/.test(nome))continue;
      if(LINHA_LIXO.test(nome))continue;
      const q=cQtd>=0?parseInt(val(r,cQtd).replace(/[^\d]/g,''),10):NaN;
      itens.push({nome,qtd:Math.max(1,isNaN(q)?1:q),dist:cDist>=0?val(r,cDist):'',usar:true});
    }
    if(itens.length){
      const dist=(itens.find(i=>i.dist)||{}).dist||'';
      let nf='';
      if(cNF>=0)for(let i=hIdx+1;i<rows.length;i++){ const v=val(rows[i],cNF).replace(/\D/g,''); if(v){nf=v;break;} }
      return {dist,nf,itens,viaCabecalho:true};
    }
  }
  // sem cabeçalho reconhecível: cai na leitura por linha, como texto
  const txt=rows.map(r=>r.map(c=>String(c==null?'':c).trim()).filter(Boolean).join('  ')).join('\n');
  const it=itensDoTexto(txt);
  return it.length?{dist:distDoTexto(txt),nf:nfDoTexto(txt),itens:it,viaCabecalho:false}:null;
}

// NF-e em XML é o caminho exato: nada de heurística
function itensDoXML(txt){
  let doc; try{ doc=new DOMParser().parseFromString(txt,'text/xml'); }catch(e){ return null; }
  if(!doc||doc.getElementsByTagName('parsererror').length)return null;
  const dets=Array.from(doc.getElementsByTagName('det'));
  if(!dets.length)return null;
  const g=(el,t)=>{ const n=el&&el.getElementsByTagName(t)[0]; return n?n.textContent.trim():''; };
  const emit=doc.getElementsByTagName('emit')[0], ide=doc.getElementsByTagName('ide')[0];
  const itens=dets.map(d=>{
    const prod=d.getElementsByTagName('prod')[0]; if(!prod)return null;
    const nome=g(prod,'xProd'); if(!nome)return null;
    return {nome,qtd:Math.max(1,Math.round(parseFloat(g(prod,'qCom')||'1'))||1),usar:true};
  }).filter(Boolean);
  return {dist:(emit?(g(emit,'xFant')||g(emit,'xNome')):''),nf:(ide?g(ide,'nNF'):''),itens};
}

/* ---------- heurística para texto solto / PDF / OCR ---------- */
// linhas de cabeçalho/rodapé que nunca são produto
const LINHA_LIXO=/^(cnpj|cpf|inscri|i\.?e\.?\b|endere|rua |av\.|avenida|bairro|cep\b|munic|fone|telefone|e-?mail|data\b|emiss|sa[íi]da|total|subtotal|valor|desconto|acr[ée]scimo|frete|seguro|icms|ipi|pis|cofins|base de c|nota fiscal|nf-?e\b|danfe|chave de acesso|protocolo|natureza|destinat|remetente|transportador|placa|peso|volume|observa|informa|vendedor|comprador|cliente|pedido|or[çc]amento|p[áa]gina|pag\b|folha|www\.|http|dados do|recebemos|assinatura|raz[ãa]o social|razao social|filial|dep[óo]sito|condi[çc][ãa]o de pag|forma de pag|banco|duplicata|vencimento)/i;
// marcadores que denunciam linha de cabeçalho de tabela em qualquer posição
const CABECALHO=/(c[óo]d(igo)?\b.*descri|descri[çc][ãa]o.*(qtd|quant|un\b|valor)|item\b.*c[óo]d|qtd.*vl\b|quant.*valor unit)/i;
// razão social solta (o cabeçalho do documento costuma virar "produto" na leitura)
const EMPRESA=/(distribuidor|ltda|eireli|epp\b|s\/?a\b|com[ée]rcio|comercial|farmac[êe]utic|atacad|logistic)/i;
const UNIDADES='UN|UND|UNID|CX|CAIXA|FR|FRASCO|CT|CP|PC|PCT|AMP|KIT|DZ|TB|BL|GALAO|SC';
const DOSAGEM=/\d+\s*(mg|mcg|ml|l\b|g\b|ui\b|%)/i;
const FARMA=/\b(c\/\s*\d+|cpr|comp\b|caps|capsula|drg|amp\b|fr\b|susp|xarope|pomada|creme|gel\b|sol\b|inj|gts|spray|adesivo)\b/i;

// separa uma linha em {nome, qtd}; devolve null quando não parece produto
function analisaLinha(bruta){
  const l=String(bruta||'').trim();
  if(l.length<5)return null;
  if(LINHA_LIXO.test(l)||CABECALHO.test(l))return null;
  if(EMPRESA.test(l)&&!DOSAGEM.test(l))return null;   // "PANPHARMA DISTRIBUIDORA" não é produto
  if(!/[A-Za-zÀ-ÿ]{3,}/.test(l))return null;

  let s=l;
  s=s.replace(/\b\d{12,14}\b/g,' ');                                  // EAN
  s=s.replace(/R\$\s*[\d.]*\d[,.]\d{2}/gi,' ');                       // R$ 1.284,00
  s=s.replace(/\b\d{1,3}(?:\.\d{3})*,\d{2}\b/g,' ');                  // 24,50 / 1.284,00
  s=s.replace(/\b\d+\.\d{2}\b/g,' ');                                 // 24.50

  // quantidade: aceita "20 CX" e "CX 20"
  let qtd=null,m;
  m=s.match(new RegExp('\\b(\\d{1,4})\\s*(?:'+UNIDADES+')\\b','i'));
  if(m){ qtd=+m[1]; s=s.replace(m[0],' '); }
  if(qtd===null){
    m=s.match(new RegExp('\\b(?:'+UNIDADES+')\\s*(\\d{1,4})\\b','i'));
    if(m){ qtd=+m[1]; s=s.replace(m[0],' '); }
  }
  if(qtd===null){ m=s.match(/\bx\s*(\d{1,4})\b/i); if(m){ qtd=+m[1]; s=s.replace(m[0],' '); } }

  s=s.replace(/^\s*\d{1,3}\s*[-.)]?\s+/,'');                          // número do item ("001  ")
  if(qtd===null){                                                     // inteiro solto sobrando no fim
    m=s.match(/\s(\d{1,4})\s*$/);
    if(m){ qtd=+m[1]; s=s.slice(0,m.index); }
  }
  s=s.replace(new RegExp('\\b(?:'+UNIDADES+')\\b','gi'),' ')
     .replace(/\b\d{5,}\b/g,' ')
     .replace(/[|;]+/g,' ')
     .replace(/\s{2,}/g,' ')
     .replace(/^[\s\-–—.:]+|[\s\-–—.:]+$/g,'')
     .trim();

  if(s.length<4)return null;
  const palavras=s.split(/\s+/).filter(w=>/[A-Za-zÀ-ÿ]{3,}/.test(w));
  const temSinalDeProduto=DOSAGEM.test(s)||FARMA.test(s);
  if(palavras.length<2 && !temSinalDeProduto)return null;             // "Carlos M." cai aqui
  const letras=(s.match(/[A-Za-zÀ-ÿ]/g)||[]).length;
  if(letras < s.length*0.4)return null;                               // sobrou mais número que texto
  return {nome:s,qtd:Math.max(1,qtd||1)};
}

function itensDoTexto(txt){
  const itens=[];
  String(txt||'').split(/\r?\n/).forEach(bruta=>{
    let linha=bruta.trim(), dist='';
    // formato explícito "PRODUTO (DISTRIBUIDORA)"
    const par=linha.match(/^(.+?)\s*\(([^)]{2,40})\)\s*(.*)$/);
    if(par && /[A-Za-zÀ-ÿ]{3,}/.test(par[2]) && !DOSAGEM.test(par[2])){
      linha=(par[1]+' '+par[3]).trim(); dist=par[2].trim();
    }
    const r=analisaLinha(linha);
    if(r)itens.push({nome:r.nome,qtd:r.qtd,dist,usar:true});
  });
  return itens;
}

function distDoTexto(txt){
  const n=norm(txt);
  const achou=DISTRIBUIDORAS.find(d=>n.indexOf(d)>=0);
  if(achou)return achou.replace(/\b\w/g,c=>c.toUpperCase());
  const nf=txt.match(/nota\s*fiscal[^\d]{0,12}(\d{3,12})/i);
  return nf?'':'';
}
function nfDoTexto(txt){
  const m=txt.match(/(?:nota\s*fiscal|nf-?e?|n[ºo°]\s*)\D{0,8}(\d{3,12})/i);
  return m?m[1]:'';
}

/* ---------- modal de progresso ---------- */
function modalProgresso(titulo){
  openModal(titulo,'ti-loader','<div id="progTxt" role="status" aria-live="polite" style="font-size:14px;line-height:1.6">Começando…</div>'
    +'<p class="hint" style="margin:12px 0 0">O arquivo não é enviado para lugar nenhum — a leitura acontece aqui no seu navegador.</p>','');
  return t=>{ const e=$('#progTxt'); if(e)e.textContent=t; };
}

/* ---------- ponto de entrada: um arquivo ---------- */
async function lerDocumento(file){
  const prog=modalProgresso('Lendo '+file.name);
  try{
    const nome=file.name.toLowerCase();
    let extraido=null, txt='';
    if(nome.endsWith('.xml')){
      txt=await file.text(); extraido=itensDoXML(txt);
      if(!extraido) extraido={dist:distDoTexto(txt),nf:nfDoTexto(txt),itens:itensDoTexto(txt)};
    }else if(nome.endsWith('.pdf')){
      txt=await textoDoPDF(file,prog);
      if(!txt.trim())throw new Error('Esse PDF não tem texto — provavelmente é digitalizado. Tire uma foto dele e anexe como imagem, ou cole o texto.');
      extraido={dist:distDoTexto(txt),nf:nfDoTexto(txt),itens:itensDoTexto(txt)};
    }else if(/\.(xlsx|xlsb|xls)$/.test(nome)){
      const rows=await readWorkbook(file);
      extraido=itensDaPlanilha(rows);
      if(!extraido)throw new Error('Não achei produtos nesta planilha. Confira se há uma coluna com o nome do produto (ex.: "Produto" ou "Descrição").');
      txt=(rows||[]).map(r=>r.join('  ')).join('\n');
    }else if(/^image\//.test(file.type)||/\.(png|jpe?g|webp|bmp|gif)$/.test(nome)){
      txt=await textoDaImagem(file,prog);
      extraido={dist:distDoTexto(txt),nf:nfDoTexto(txt),itens:itensDoTexto(txt)};
    }else{
      txt=await file.text();
      extraido={dist:distDoTexto(txt),nf:nfDoTexto(txt),itens:itensDoTexto(txt)};
    }
    closeModal();
    conferirItens(extraido,file.name,txt);
  }catch(e){
    closeModal();
    openModal('Não deu para ler o arquivo','ti-alert-triangle',
      '<div class="alert danger"><i class="ti ti-alert-triangle" aria-hidden="true"></i><div>'+esc(e.message||'Erro desconhecido')+'</div></div>'
      +'<p class="hint" style="margin:12px 0 0">Alternativas: use o <b>XML da NF-e</b> (leitura exata), cole o texto do pedido, ou lance os itens manualmente.</p>',
      '<button class="btn btn-ghost btn-sm" onclick="closeModal()">Fechar</button>');
  }
}

/* ---------- conferência antes de importar ---------- */
let _conf={itens:[],arquivo:'',dist:'',nf:''};
function conferirItens(ex,arquivo,txtBruto){
  _conf={itens:(ex&&ex.itens)||[],arquivo:arquivo||'colado',dist:(ex&&ex.dist)||'',nf:(ex&&ex.nf)||'',bruto:txtBruto||''};
  if(!_conf.itens.length){
    openModal('Nenhum produto reconhecido','ti-search-off',
      '<p class="hint" style="margin:0 0 12px">Não achei linhas com cara de produto em <b>'+esc(_conf.arquivo)+'</b>.</p>'
      +'<p class="hint" style="margin:0 0 12px">Você pode usar cada linha do documento como um produto e apagar o que não servir, ou lançar manualmente.</p>',
      '<button class="btn btn-ghost btn-sm" id="cfLinhas">Usar cada linha</button><button class="btn btn-ghost btn-sm" onclick="closeModal()">Cancelar</button>');
    $('#cfLinhas').onclick=()=>{
      _conf.itens=(_conf.bruto||'').split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>3).map(l=>({nome:l,qtd:1,dist:'',usar:true}));
      if(!_conf.itens.length){ toast('O documento veio vazio','err'); closeModal(); return; }
      closeModal(); conferirItens({itens:_conf.itens,dist:_conf.dist,nf:_conf.nf},_conf.arquivo,_conf.bruto);
    };
    return;
  }
  let b='<div class="two"><div class="f-wrap"><label class="f" for="cfDist">Distribuidora</label>'
    +'<input id="cfDist" value="'+esc(_conf.dist)+'" placeholder="ex.: Servimed"></div>'
    +'<div class="f-wrap"><label class="f" for="cfNF">Nota fiscal (opcional)</label>'
    +'<input id="cfNF" value="'+esc(_conf.nf)+'" inputmode="numeric" placeholder="ex.: 123456"></div></div>'
    +'<p class="hint" style="margin:14px 0 8px">Confira antes de importar — desmarque o que não for produto e corrija nomes se precisar. A distribuidora acima vale para os itens que não trouxerem a sua própria.</p>'
    +'<div class="tbl-wrap" style="max-height:46vh;overflow-y:auto"><table class="mini-tbl"><thead><tr>'
    +'<th style="width:36px"><span class="sr-only">Incluir</span></th><th>Produto</th><th style="width:74px">Qtd</th></tr></thead><tbody>';
  _conf.itens.forEach((it,i)=>{
    b+='<tr><td><input type="checkbox" class="cfUsar" data-i="'+i+'"'+(it.usar?' checked':'')+' aria-label="Incluir '+esc(it.nome)+'"></td>'
      +'<td><input class="cfNome" data-i="'+i+'" data-dist="'+esc(it.dist||'')+'" value="'+esc(it.nome)+'" aria-label="Nome do produto '+(i+1)+'">'
      +(it.dist?'<span class="tag gray" style="margin-top:4px">'+esc(it.dist)+'</span>':'')+'</td>'
      +'<td><input class="cfQtd" data-i="'+i+'" type="number" min="1" value="'+(it.qtd||1)+'" aria-label="Quantidade do produto '+(i+1)+'"></td></tr>';
  });
  b+='</tbody></table></div>';
  openModal('Conferir '+_conf.itens.length+' item(ns) — '+_conf.arquivo,'ti-list-check',b,
    '<button class="btn btn-ghost btn-sm" id="cfNada" type="button">Desmarcar todos</button>'
    +'<button class="btn btn-primary btn-sm" id="cfOk" type="button"><i class="ti ti-download" aria-hidden="true"></i> Importar selecionados</button>');
  $('#cfNada').onclick=()=>{ $$('.cfUsar').forEach(c=>c.checked=false); };
  $('#cfOk').onclick=()=>{
    const dist=$('#cfDist').value.trim(), nf=$('#cfNF').value.trim();
    const escolhidos=[];
    $$('.cfUsar').forEach(c=>{
      if(!c.checked)return; const i=c.dataset.i;
      const campo=$('.cfNome[data-i="'+i+'"]'), nome=campo.value.trim();
      if(!nome)return;
      // a distribuidora do próprio item vence a do cabeçalho
      escolhidos.push({nome,qtd:Math.max(1,+$('.cfQtd[data-i="'+i+'"]').value||1),dist:(campo.dataset.dist||'').trim()});
    });
    if(!escolhidos.length){ toast('Selecione ao menos um produto','err'); return; }
    const docId=uid();
    RECDOC.push({id:docId,arquivo:_conf.arquivo,dist,nf,data:todayStr(),itens:escolhidos.length});
    escolhidos.forEach(e=>RECEB.push({id:uid(),nome:e.nome,qtd:e.qtd,dist:e.dist||dist,nf,docId,recebido:false,quando:'',obs:''}));
    saveAll(); closeModal(); renderReceb();
    toast(escolhidos.length+' produto(s) na lista de recebimento','ok');
  };
}

/* ---------- entrada por texto colado ---------- */
function colarTextoReceb(){
  openModal('Colar lista / texto do pedido','ti-clipboard',
    '<p class="hint" style="margin:0 0 10px">Cole o texto do pedido, do e-mail ou da nota. Uma linha por produto. Se a distribuidora vier entre parênteses no fim da linha, ela é reconhecida sozinha.</p>'
    +'<div class="f-wrap"><label class="f" for="colTxt">Texto</label><textarea id="colTxt" rows="9" placeholder="DIPIRONA 500MG C/10 (Servimed)&#10;AMOXICILINA 500MG C/21 (Panpharma)&#10;SORO FISIOLOGICO 500ML  x 12"></textarea></div>',
    '<button class="btn btn-primary btn-sm" id="colOk" type="button"><i class="ti ti-arrow-right" aria-hidden="true"></i> Analisar</button>');
  $('#colOk').onclick=()=>{
    const t=$('#colTxt').value;
    if(!t.trim()){ toast('Cole algum texto','err'); return; }
    closeModal();
    conferirItens({dist:distDoTexto(t),nf:nfDoTexto(t),itens:itensDoTexto(t)},'texto colado',t);
  };
}

/* ---------- item manual ---------- */
function itemManual(){
  const dists=[...new Set(RECEB.map(r=>r.dist).filter(Boolean))];
  openModal('Adicionar produto','ti-plus',
    '<div class="f-wrap"><label class="f" for="miNome">Produto</label><input id="miNome" placeholder="ex.: Dipirona 500mg c/10"></div>'
    +'<div class="two" style="margin-top:12px"><div class="f-wrap"><label class="f" for="miDist">Distribuidora</label>'
    +'<input id="miDist" list="distList" placeholder="ex.: Servimed"><datalist id="distList">'+dists.map(d=>'<option value="'+esc(d)+'">').join('')+'</datalist></div>'
    +'<div class="f-wrap"><label class="f" for="miQtd">Quantidade</label><input id="miQtd" type="number" min="1" value="1"></div></div>'
    +'<div class="f-wrap" style="margin-top:12px"><label class="f" for="miNF">Nota fiscal (opcional)</label><input id="miNF" inputmode="numeric"></div>',
    '<button class="btn btn-primary btn-sm" id="miOk" type="button"><i class="ti ti-check" aria-hidden="true"></i> Adicionar</button>');
  $('#miOk').onclick=()=>{
    const nome=$('#miNome').value.trim();
    if(!nome){ toast('Informe o produto','err'); $('#miNome').focus(); return; }
    RECEB.push({id:uid(),nome,qtd:Math.max(1,+$('#miQtd').value||1),dist:$('#miDist').value.trim(),
      nf:$('#miNF').value.trim(),docId:'',recebido:false,quando:'',obs:''});
    saveAll(); closeModal(); renderReceb(); toast('Produto adicionado','ok');
  };
}

/* ---------- a aba ---------- */
function renderReceb(){
  const el=$('#tab-receb');
  const total=RECEB.length, ok=RECEB.filter(r=>r.recebido).length, pct=total?Math.round(ok/total*100):0;

  let html='<div class="card"><h2><i class="ti ti-package-import" aria-hidden="true"></i> Entrada de mercadoria</h2>'
    +'<p class="hint">Anexe a nota, o pedido ou uma foto. O app lê o documento aqui no navegador, lista os produtos para você conferir e depois é só ir marcando o que chegou.</p>'
    +'<div class="drop" id="recDrop" role="button" tabindex="0" aria-label="Escolher arquivo para ler">'
    +'<i class="ti ti-cloud-upload" aria-hidden="true"></i><p>Arraste o arquivo aqui ou clique para escolher</p>'
    +'<small>XML da NF-e (leitura exata) · Excel · PDF · imagem/foto · TXT/CSV</small>'
    +'<input type="file" id="recFile" accept=".xml,.xlsx,.xlsb,.xls,.pdf,.txt,.csv,image/*" style="display:none"></div>'
    +'<div class="row-actions"><button class="btn btn-ghost btn-sm" id="recColar" type="button"><i class="ti ti-clipboard" aria-hidden="true"></i> Colar texto</button>'
    +'<button class="btn btn-ghost btn-sm" id="recManual" type="button"><i class="ti ti-plus" aria-hidden="true"></i> Adicionar produto</button></div>'
    +'<p class="hint" style="margin:14px 0 0"><b>O que funciona melhor:</b> XML da NF-e e Excel saem exatos (na planilha, basta ter uma coluna de produto — quantidade e distribuidora são reconhecidas se existirem). PDF só é lido se tiver texto (PDF digitalizado não tem). Foto passa por tratamento de imagem e reconhecimento, mas ainda erra caracteres — por isso a lista sempre aparece para conferência. O arquivo não fica salvo, só os itens.</p>'
    +'</div>';

  if(total){
    html+='<div class="card"><h2><i class="ti ti-checkup-list" aria-hidden="true"></i> Lista de recebimento '
      +'<span class="tag '+(ok===total?'':'gray')+'">'+ok+' de '+total+'</span></h2>'
      +'<div class="prog" aria-hidden="true"><i style="width:'+pct+'%"></i></div>'
      +'<p class="hint" style="margin:8px 0 14px">'+(ok===total?'Tudo conferido. ':'Faltam '+(total-ok)+' produto(s) para chegar. ')+'Marque a caixa quando o produto entrar.</p>'
      +'<div class="search-wrap"><i class="ti ti-search" aria-hidden="true"></i>'
      +'<input type="text" style="position:absolute;opacity:0;pointer-events:none;height:0" tabindex="-1" aria-hidden="true" autocomplete="username">'
      +'<label class="sr-only" for="recBusca">Buscar produto</label>'
      +'<input id="recBusca" type="search" autocomplete="off" placeholder="Buscar produto ou distribuidora…" value="'+esc(buscaRec)+'"></div>'
      +'<div class="seg" role="group" aria-label="Filtrar itens" style="margin-bottom:14px">'
      +'<button type="button" class="fRec" data-f="todos" aria-pressed="'+(filtroRec==='todos')+'">Todos</button>'
      +'<button type="button" class="fRec" data-f="pend" aria-pressed="'+(filtroRec==='pend')+'">Pendentes</button>'
      +'<button type="button" class="fRec" data-f="ok" aria-pressed="'+(filtroRec==='ok')+'">Recebidos</button></div>';

    const q=norm(buscaRec);
    let lista=RECEB.filter(r=>{
      if(filtroRec==='pend'&&r.recebido)return false;
      if(filtroRec==='ok'&&!r.recebido)return false;
      if(q&&!(norm(r.nome).includes(q)||norm(r.dist||'').includes(q)||norm(r.nf||'').includes(q)))return false;
      return true;
    });
    if(!lista.length){
      html+='<div class="empty"><i class="ti ti-search-off" aria-hidden="true"></i>Nenhum produto '
        +(q?'para “'+esc(buscaRec)+'”':'neste filtro')+'.</div>';
    }else{
      // agrupado por distribuidora, que é como a mercadoria chega
      const grupos={};
      lista.forEach(r=>{ const k=r.dist||'Sem distribuidora'; (grupos[k]=grupos[k]||[]).push(r); });
      Object.keys(grupos).sort((a,b)=>a.localeCompare(b)).forEach((g,gi)=>{
        const arr=grupos[g].sort((a,b)=>a.nome.localeCompare(b.nome));
        const gok=arr.filter(r=>r.recebido).length;
        html+='<div style="margin:16px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
          +'<span class="tag c'+(gi%6)+'"><i class="ti ti-truck-delivery" aria-hidden="true"></i> '+esc(g)+'</span>'
          +'<span class="muted" style="font-size:12px">'+gok+' de '+arr.length+' recebido(s)</span></div>';
        arr.forEach(r=>{
          html+='<div class="rec-item'+(r.recebido?' feito':'')+'">'
            +'<label class="rec-chk"><input type="checkbox" class="recChk" data-id="'+r.id+'"'+(r.recebido?' checked':'')
            +' aria-label="Marcar '+esc(r.nome)+' como recebido"><span class="sr-only">Recebido</span></label>'
            +'<div class="rec-nm"><b>'+esc(r.nome)+'</b>'
            +'<span class="muted">'+(r.dist?'('+esc(r.dist)+')':'(sem distribuidora)')
            +(r.qtd>1?' · '+r.qtd+' un':'')+(r.nf?' · NF '+esc(r.nf):'')
            +(r.recebido&&r.quando?' · chegou em '+fmtDateBR(r.quando):'')+'</span></div>'
            +'<button class="btn btn-ghost btn-sm recDiv" type="button" data-id="'+r.id+'" aria-label="Registrar divergência de '+esc(r.nome)+'" title="Registrar divergência"><i class="ti ti-file-alert" aria-hidden="true"></i></button>'
            +'<button class="btn btn-danger btn-sm recDel" type="button" data-id="'+r.id+'" aria-label="Remover '+esc(r.nome)+' da lista"><i class="ti ti-trash" aria-hidden="true"></i></button>'
            +'</div>';
        });
      });
    }
    html+='<div class="row-actions"><button class="btn btn-ghost btn-sm" id="recLimparOk" type="button"><i class="ti ti-eraser" aria-hidden="true"></i> Limpar recebidos</button></div></div>';
  }else{
    html+='<div class="card"><div class="empty"><i class="ti ti-package-off" aria-hidden="true"></i>Nenhum produto na lista ainda.<br>Anexe um documento, cole o texto do pedido ou adicione manualmente.</div></div>';
  }

  if(RECDOC.length){
    html+='<div class="card"><h2><i class="ti ti-files" aria-hidden="true"></i> Documentos lidos</h2>'
      +'<div class="tbl-wrap"><table><thead><tr><th>Arquivo</th><th>Distribuidora</th><th>NF</th><th>Itens</th><th>Data</th><th></th></tr></thead><tbody>';
    RECDOC.slice().reverse().forEach(d=>{
      html+='<tr><td>'+esc(d.arquivo)+'</td><td>'+esc(d.dist||'—')+'</td><td class="num">'+esc(d.nf||'—')+'</td>'
        +'<td class="num">'+d.itens+'</td><td class="num">'+fmtDateBR(d.data)+'</td>'
        +'<td style="text-align:right"><button class="btn btn-danger btn-sm docDel" type="button" data-id="'+d.id+'" aria-label="Excluir '+esc(d.arquivo)+' e seus itens"><i class="ti ti-trash" aria-hidden="true"></i></button></td></tr>';
    });
    html+='</tbody></table></div><p class="hint" style="margin:10px 0 0">Excluir um documento remove também os itens que vieram dele.</p></div>';
  }

  el.innerHTML=html;

  // ---- ligações
  const drop=$('#recDrop'), file=$('#recFile');
  drop.onclick=()=>file.click();
  drop.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); file.click(); } };
  file.onchange=e=>{ if(e.target.files[0])lerDocumento(e.target.files[0]); file.value=''; };
  ['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('over');}));
  ['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('over');}));
  drop.addEventListener('drop',e=>{ const f=e.dataTransfer.files[0]; if(f)lerDocumento(f); });
  $('#recColar').onclick=colarTextoReceb;
  $('#recManual').onclick=itemManual;

  const bs=$('#recBusca');
  if(bs){
    bs.oninput=e=>{
      let v=e.target.value; if(v.includes('@')){ v=''; e.target.value=''; }
      buscaRec=v; const pos=e.target.selectionStart; renderReceb();
      const n=$('#recBusca'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(err){} }
    };
    bs.onfocus=e=>{ if(e.target.value.includes('@')){ e.target.value=''; buscaRec=''; } };
  }
  $$('.fRec').forEach(b=>b.onclick=()=>{ filtroRec=b.dataset.f; renderReceb(); });
  $$('.recChk').forEach(c=>c.onchange=()=>{
    const r=RECEB.find(x=>x.id===c.dataset.id); if(!r)return;
    r.recebido=c.checked; r.quando=c.checked?todayStr():'';
    saveAll(); renderReceb();
  });
  $$('.recDel').forEach(b=>b.onclick=()=>{
    const r=RECEB.find(x=>x.id===b.dataset.id); if(!r)return;
    if(!confirm('Remover “'+r.nome+'” da lista de recebimento?'))return;
    RECEB=RECEB.filter(x=>x.id!==b.dataset.id); saveAll(); renderReceb();
  });
  $$('.recDiv').forEach(b=>b.onclick=()=>{
    const r=RECEB.find(x=>x.id===b.dataset.id); if(!r)return;
    selectTab('diverg'); formDiverg(null,{nf:r.nf||'',produto:r.nome,dist:r.dist||'',qtd:r.qtd||1});
  });
  const lo=$('#recLimparOk');
  if(lo)lo.onclick=()=>{
    const n=RECEB.filter(r=>r.recebido).length;
    if(!n){ toast('Nenhum item recebido ainda'); return; }
    if(!confirm('Tirar da lista os '+n+' produto(s) já recebidos?'))return;
    RECEB=RECEB.filter(r=>!r.recebido); saveAll(); renderReceb(); toast(n+' item(ns) removido(s)');
  };
  $$('.docDel').forEach(b=>b.onclick=()=>{
    const d=RECDOC.find(x=>x.id===b.dataset.id); if(!d)return;
    const n=RECEB.filter(r=>r.docId===d.id).length;
    if(!confirm('Excluir “'+d.arquivo+'” e os '+n+' item(ns) que vieram dele?'))return;
    RECEB=RECEB.filter(r=>r.docId!==d.id); RECDOC=RECDOC.filter(x=>x.id!==d.id);
    saveAll(); renderReceb();
  });
}

/* ============================================================
   ABA: DIVERGÊNCIAS / PENDÊNCIAS DE NOTA FISCAL

let buscaDiv='', filtroDiv='abertas';
const MOTIVOS=['Produto avariado','Validade curta','Produto vencido','Produto trocado','Veio a mais',

  const q=norm(buscaDiv);

    if(filtroDiv==='resolvidas'&&d.status!=='resolvida')return false;
    if(q&&!(norm(d.produto).includes(q)||norm(d.nf).includes(q)||norm(d.dist||'').includes(q)

/* ---------- diagnóstico e recuperação do armazenamento ---------- */
function lerBackup(k){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):null; }catch(e){ return null; } }
function tamanhoLS(){
  let n=0; try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); n+=(k+(localStorage.getItem(k)||'')).length; } }catch(e){}
  return n;
}
function cardRecuperacao(){
  const chaves=[];
  try{ for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i);
    if(/^fg_/.test(k))chaves.push({k,len:(localStorage.getItem(k)||'').length}); } }catch(e){}
  chaves.sort((a,b)=>a.k.localeCompare(b.k));
  const atual=contarRegistros(estadoAtual());
  const bks=[{k:'fg_bak_cheio',rot:'Última versão com dados'},{k:'fg_bak1',rot:'Backup 1 (mais recente)'},
             {k:'fg_bak2',rot:'Backup 2'},{k:'fg_bak3',rot:'Backup 3'}]
    .map(b=>{ const d=lerBackup(b.k); return d?{...b,n:contarRegistros(d),quando:d.quando||''}:null; }).filter(Boolean);

  let h='<div class="card"><h2><i class="ti ti-lifebuoy" aria-hidden="true"></i> Diagnóstico e recuperação</h2>'
    +'<p class="hint">Seus dados moram só neste navegador. Se algo desapareceu, confira aqui antes de recadastrar.</p>';
  if(temDadoIlegivel())
    h+='<div class="alert danger"><i class="ti ti-alert-triangle" aria-hidden="true"></i><div><b>Há conteúdo ilegível no armazenamento</b> ('+esc(Object.keys(LS_RUIM).join(', '))+'). O app parou de salvar para não apagar nada. Exporte um backup e me avise.</div></div>';
  if(LS_CHEIO)
    h+='<div class="alert danger"><i class="ti ti-database-exclamation" aria-hidden="true"></i><div><b>O navegador recusou salvar</b> — armazenamento cheio. Exporte um backup e apague o que não usa.</div></div>';

  h+='<div class="stats"><div class="stat'+(atual?' good':' bad')+'"><div class="v">'+atual+'</div><div class="k"><i class="ti ti-database" aria-hidden="true"></i> Registros carregados</div></div>'
    +'<div class="stat"><div class="v">'+Math.round(tamanhoLS()/1024)+'</div><div class="k"><i class="ti ti-weight" aria-hidden="true"></i> KB usados</div></div>'
    +'<div class="stat"><div class="v">'+bks.length+'</div><div class="k"><i class="ti ti-history" aria-hidden="true"></i> Cópias internas</div></div></div>';

  if(bks.length){
    h+='<div class="tbl-wrap" style="margin-top:14px"><table class="mini-tbl"><thead><tr><th>Cópia</th><th>Registros</th><th>Quando</th><th></th></tr></thead><tbody>';
    bks.forEach(b=>{
      h+='<tr><td>'+esc(b.rot)+'</td><td class="num"><b>'+b.n+'</b></td>'
        +'<td class="num" style="font-size:11.5px">'+esc(b.quando?b.quando.replace('T',' ').slice(0,16):'—')+'</td>'
        +'<td style="text-align:right"><button class="btn btn-primary btn-sm recRest" type="button" data-k="'+b.k+'"'+(b.n?'':' disabled')+'><i class="ti ti-restore" aria-hidden="true"></i> Restaurar</button></td></tr>';
    });
    h+='</tbody></table></div><p class="hint" style="margin:10px 0 0">Restaurar substitui o que está na tela pela cópia escolhida. O que existe agora é salvo como backup antes.</p>';
  }else{
    h+='<div class="alert info" style="margin-top:14px"><i class="ti ti-info-circle" aria-hidden="true"></i><div>Nenhuma cópia interna ainda. Elas passam a ser criadas a cada alteração — e o arquivo de <b>Backup</b> abaixo continua sendo a garantia que sobrevive a troca de navegador.</div></div>';
  }

  h+='<div class="row-actions"><button class="btn btn-ghost btn-sm" id="recVer" type="button"><i class="ti ti-list-details" aria-hidden="true"></i> Ver o que está guardado</button></div>';
  if(chaves.length){
    h+='<details style="margin-top:12px"><summary class="muted" style="cursor:pointer;font-size:13px">Chaves no armazenamento ('+chaves.length+')</summary>'
      +'<div class="tbl-wrap" style="margin-top:8px"><table class="mini-tbl"><tbody>'
      +chaves.map(c=>'<tr><td class="num" style="font-size:12px">'+esc(c.k)+'</td><td class="num">'+c.len+' car.</td></tr>').join('')
      +'</tbody></table></div></details>';
  }
  return h+'</div>';
}

/* ============================================================
   ABA: VALIDADE — produtos de olho no vencimento
   Você cadastra o medicamento e a data de validade; o app avisa
   quando entra na janela de alerta (padrão 45 dias). Sem servidor,
   o aviso acontece quando o app é aberto: selo na aba, faixa no
   topo e, se você autorizar, uma notificação do navegador.
   ============================================================ */
let buscaVal='', filtroVal='alerta';

function diasAte(dataStr){
  const d=parseDate(dataStr); if(!d)return null;
  const hoje=parseDate(todayStr());
  return Math.round((d-hoje)/86400000);
}
function situacaoVal(item){
  const n=diasAte(item.venc);
  if(n===null)return {t:'sem',rot:'Sem data',dias:null};
  if(n<0)   return {t:'vencido',rot:'Vencido há '+Math.abs(n)+' dia(s)',dias:n};
  if(n===0) return {t:'vencido',rot:'Vence hoje',dias:0};
  if(n<=(+VALCFG.dias||45)) return {t:'alerta',rot:'Vence em '+n+' dia(s)',dias:n};
  return {t:'ok',rot:'Vence em '+n+' dia(s)',dias:n};
}
// quantos exigem atenção agora (vencidos + dentro da janela)
function contarAlertasVal(){
  return VALIDADE.filter(v=>{ const s=situacaoVal(v); return s.t==='vencido'||s.t==='alerta'; }).length;
}
function selosDasAbas(){
  const n=contarAlertasVal();
  ['#tb-validade','#bb-validade'].forEach(sel=>{
    const b=$(sel); if(!b)return;
    let selo=b.querySelector('.tab-badge');
    if(n>0){
      if(!selo){ selo=document.createElement('span'); selo.className='tab-badge'; b.appendChild(selo); }
      selo.textContent=n>99?'99+':n;
      selo.setAttribute('aria-label',n+' produto(s) precisando de atenção');
    }else if(selo)selo.remove();
  });
}

/* ---------- aviso do navegador (só com o app aberto) ---------- */
function podeNotificar(){ return typeof Notification!=='undefined'; }
async function pedirNotificacao(){
  if(!podeNotificar()){ toast('Este navegador não tem notificações','err'); return; }
  let p=Notification.permission;
  if(p==='default'){ try{ p=await Notification.requestPermission(); }catch(e){ p='denied'; } }
  if(p==='granted'){ VALCFG.notificar=true; saveAll(); toast('Aviso do navegador ligado','ok'); avisarVencimentos(true); }
  else { VALCFG.notificar=false; saveAll(); toast('O navegador bloqueou as notificações','err'); }
  renderValidade();
}
function avisarVencimentos(forcar){
  if(!VALCFG.notificar||!podeNotificar()||Notification.permission!=='granted')return;
  const hoje=todayStr();
  if(!forcar&&VALCFG.ultimoAviso===hoje)return;   // um aviso por dia
  const lista=VALIDADE.filter(v=>{ const s=situacaoVal(v); return s.t==='vencido'||s.t==='alerta'; });
  if(!lista.length)return;
  VALCFG.ultimoAviso=hoje; saveAll();
  const vencidos=lista.filter(v=>situacaoVal(v).t==='vencido').length;
  const corpo=lista.slice(0,4).map(v=>'• '+v.nome+' — '+situacaoVal(v).rot).join('\n')
    +(lista.length>4?'\n… e mais '+(lista.length-4):'');
  try{
    new Notification('FarmáciaGest — '+lista.length+' produto(s) de olho'+(vencidos?' ('+vencidos+' vencido[s])':''),
      {body:corpo,tag:'farmaciagest-validade'});
  }catch(e){ /* alguns navegadores exigem service worker: o aviso na tela já cobre */ }
}

/* ---------- cadastro ---------- */
function formValidade(id,pre){
  const it=id?VALIDADE.find(x=>x.id===id):null;
  const v=it||pre||{};
  const dists=[...new Set(RECEB.concat(VALIDADE).map(x=>x.dist).filter(Boolean))];
  openModal(it?'Editar produto':'Adicionar produto para acompanhar','ti-calendar-exclamation',

      html+='<div class="alert warn"><i class="ti ti-clock-exclamation" aria-hidden="true"></i><div><b>'+alerta.length+' produto(s) vencem nos próximos '+janela+' dias</b> — dá tempo de negociar troca ou promover a saída.</div></div>';

function ligarValidade(){
  const nv=$('#vlNovo'); if(nv)nv.onclick=()=>formValidade(null);
  const cfg=$('#vlCfg');
  if(cfg)cfg.onclick=()=>{
    openModal('Janela de alerta','ti-settings',
      '<p class="hint" style="margin-top:0">Com quantos dias de antecedência o produto deve entrar em alerta?</p>'
      +'<div class="f-wrap"><label class="f" for="vlDias">Dias antes do vencimento</label>'
      +'<input id="vlDias" type="number" min="1" max="365" value="'+(+VALCFG.dias||45)+'"></div>',
      '<button class="btn btn-ghost btn-sm" type="button" onclick="closeModal()">Cancelar</button>'
      +'<button class="btn btn-primary btn-sm" id="vlDiasOk" type="button"><i class="ti ti-check" aria-hidden="true"></i> Salvar</button>');
    $('#vlDiasOk').onclick=()=>{
      const n=Math.max(1,Math.min(365,+$('#vlDias').value||45));
      VALCFG.dias=n; saveAll(); closeModal(); renderValidade(); selosDasAbas();
      toast('Alerta com '+n+' dias de antecedência','ok');
    };
  };
  const nt=$('#vlNotif'); if(nt)nt.onclick=pedirNotificacao;
  const bs=$('#vlBusca');
  if(bs){
    bs.oninput=e=>{
      let v=e.target.value; if(v.includes('@')){ v=''; e.target.value=''; }
      buscaVal=v; const pos=e.target.selectionStart; renderValidade();
      const n=$('#vlBusca'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(err){} }
    };
    bs.onfocus=e=>{ if(e.target.value.includes('@')){ e.target.value=''; buscaVal=''; } };
  }
  $$('.fVal').forEach(b=>b.onclick=()=>{ filtroVal=b.dataset.f; renderValidade(); });
  $$('.vlEdit').forEach(b=>b.onclick=()=>formValidade(b.dataset.id));
  $$('.vlOkBtn').forEach(b=>b.onclick=()=>{
    const v=VALIDADE.find(x=>x.id===b.dataset.id); if(!v)return;
    v.resolvido=!v.resolvido; saveAll(); renderValidade(); selosDasAbas();
    toast(v.resolvido?'Marcado como resolvido':'Reaberto');
  });
  $$('.vlDel').forEach(b=>b.onclick=()=>{
    const v=VALIDADE.find(x=>x.id===b.dataset.id); if(!v)return;
    if(!confirm('Excluir “'+v.nome+'” do acompanhamento?'))return;
    VALIDADE=VALIDADE.filter(x=>x.id!==b.dataset.id); saveAll(); renderValidade(); selosDasAbas();
  });
  $$('.vlDiv').forEach(b=>b.onclick=()=>{
    const v=VALIDADE.find(x=>x.id===b.dataset.id); if(!v)return;
    selectTab('diverg');
    formDiverg(null,{produto:v.nome,dist:v.dist||'',qtd:v.qtd||1,lote:v.lote||'',ean:v.ean||'',
      motivo:situacaoVal(v).t==='vencido'?'Produto vencido':'Validade curta'});
  });
}

/* ============================================================
   NUVEM — conta MedTech pelo motor dos apps de estudo (mtsync.js)
   Cada funcionário, troca, lançamento, item etc. é um documento próprio em
   users/{uid}/apps/sosgestao/sync — último que editou vence POR ITEM e exclusão vira lápide.
   Quem liga é conta-gestao.js (só no site). Aqui ficam só os ganchos que ele usa.
   ============================================================ */
const FG_COLS={
  funcs:['fg_funcs',()=>FUNCS,v=>FUNCS=v], trocas:['fg_trocas',()=>TROCAS,v=>TROCAS=v], banco:['fg_banco',()=>BANCO,v=>BANCO=v],
  feriados:['fg_feriados',()=>FERIAS,v=>FERIAS=v], turnos:['fg_turnos',()=>TURNOS,v=>TURNOS=v], cats:['fg_cats',()=>CATS,v=>CATS=v],
  minimos:['fg_minimos',()=>MINIMOS,v=>MINIMOS=v], receb:['fg_receb',()=>RECEB,v=>RECEB=v], recdoc:['fg_recdoc',()=>RECDOC,v=>RECDOC=v],
  diverg:['fg_diverg',()=>DIVERG,v=>DIVERG=v], mensal:['fg_mensal',()=>MENSAL,v=>MENSAL=v], validade:['fg_validade',()=>VALIDADE,v=>VALIDADE=v],
  valcfg:['fg_valcfg',()=>VALCFG,v=>VALCFG=v]
};
let _recebendo=false;
window.FG={
  cols:FG_COLS,
  ler(c){ const x=FG_COLS[c]; return x?x[1]():undefined; },
  gravar(c,v){ const x=FG_COLS[c]; if(!x)return; _recebendo=true; try{ x[2](v); saveLS(x[0],v); } finally{ _recebendo=false; } },
  aoReceber(){ try{ ensureMinimos(); saveLS('fg_minimos',MINIMOS); gravarBackup(); render(); selosDasAbas(); }catch(e){ console.error(e); } },
  /* importação única do FarmáciaGest antigo (documento users/{uid}/apps/farmaciagest):
     junta POR ID com o que já está aqui; o que já existe no aparelho vence */
  juntarAntigo(p){
    if(!p||typeof p!=='object')return 0;
    let novos=0;
    const lista=(c,campo)=>{ const atual=FG_COLS[c][1]()||[]; const tem=new Set(atual.map(x=>x&&String(x[campo])));
      (Array.isArray(p[c==='feriados'?'ferias':c])?p[c==='feriados'?'ferias':c]:[]).forEach(x=>{ if(x&&x[campo]!=null&&!tem.has(String(x[campo]))){ const y=Object.assign({},x); delete y._upd; atual.push(y); tem.add(String(x[campo])); novos++; } });
      FG_COLS[c][2](atual); };
    ['funcs','trocas','banco','receb','recdoc','diverg','mensal','validade','turnos','cats'].forEach(c=>lista(c,'id'));
    lista('feriados','data');
    if(p.minimos&&typeof p.minimos==='object')Object.keys(p.minimos).forEach(t=>{ MINIMOS[t]=Object.assign({},p.minimos[t],MINIMOS[t]||{}); });
    if(p.valcfg&&typeof p.valcfg==='object')VALCFG=Object.assign({},p.valcfg,VALCFG);
    ensureMinimos(); saveAllInterno(); gravarBackup();
    return novos;
  },
  naConta(email){ const o=$('#ondeDados'); if(o)o.textContent='os dados ficam neste aparelho e na conta '+(email||'MedTech')+', com sincronização automática'; }
};

  html+='<div class="card"><h2><i class="ti ti-flask"></i> Banco de dados de teste</h2>'
    +'<p class="hint">Cria uma farmácia fictícia completa — 12 funcionários nos 3 turnos, folgas, trocas, lançamentos de banco de horas, feriados, uma lista de recebimento com 4 distribuidoras e divergências de nota — para você experimentar o app com a tela cheia. Tudo que nasce aqui fica marcado como <span class="tag gray">teste</span> e sai de uma vez só; seus dados reais não são tocados.</p>'
    +'<div class="row-actions" style="margin-top:0"><button class="btn btn-primary btn-sm" id="demoSeed"><i class="ti ti-database-plus"></i> '+(temD?'Recriar banco de teste':'Criar banco de teste')+'</button>'
    +(temD?'<button class="btn btn-danger btn-sm" id="demoClear"><i class="ti ti-database-off"></i> Remover dados de teste</button>':'')+'</div>'
    +(temD?('<p class="hint" style="margin:14px 0 0">No app agora: <b>'+dc.funcs+'</b> funcionário(s), <b>'+dc.trocas+'</b> troca(s), <b>'+dc.banco+'</b> lançamento(s), <b>'+dc.ferias+'</b> feriado(s), <b>'+dc.receb+'</b> item(ns) de recebimento e <b>'+dc.diverg+'</b> divergência(s) de teste.</p>'):'')
    +'</div>';

  html+=cardRecuperacao();
  html+='<div class="card"><h2><i class="ti ti-database"></i> Backup dos dados</h2><p class="hint">Exporte tudo para um arquivo (guarde como cópia de segurança) ou restaure de um arquivo salvo.</p>'
    +'<div class="row-actions" style="margin-top:0"><button class="btn btn-ghost btn-sm" id="bkExport"><i class="ti ti-download"></i> Exportar dados</button>'
    +'<button class="btn btn-ghost btn-sm" id="bkImport"><i class="ti ti-upload"></i> Importar dados</button>'
    +'<button class="btn btn-danger btn-sm" id="bkClear"><i class="ti ti-trash"></i> Apagar tudo</button></div>'
    +'<input type="file" id="bkFile" accept="application/json" style="display:none"></div>';

  el.innerHTML=html;

  $('#minSave').onclick=()=>{ $$('.minInp').forEach(i=>{ MINIMOS[i.dataset.t][i.dataset.c]=Math.max(0,+i.value||0); }); saveAll(); toast('Mínimos salvos','ok'); };

  $('#turnoAdd').onclick=()=>{ const n=$('#ntN').value.trim(); if(!n){toast('Nome do turno','err');return;} TURNOS.push({id:uid(),nome:n,ini:$('#ntI').value.trim()||'00:00',fim:$('#ntF').value.trim()||'00:00'}); ensureMinimos(); saveAll(); renderConfig(); };
  $('#turnoSave').onclick=()=>{ $$('#turnoBody tr').forEach(tr=>{ const t=turnoOf(tr.dataset.id); if(t){ t.nome=$('.tN',tr).value.trim()||t.nome; t.ini=$('.tI',tr).value.trim(); t.fim=$('.tF',tr).value.trim(); } }); saveAll(); toast('Turnos salvos','ok'); renderConfig(); };
  $$('.turnoDel').forEach(b=>b.onclick=()=>{ if(TURNOS.length<=1){toast('Mantenha ao menos 1 turno','err');return;} if(FUNCS.some(f=>f.turnoId===b.dataset.id)){toast('Há funcionários neste turno','err');return;} TURNOS=TURNOS.filter(t=>t.id!==b.dataset.id); delete MINIMOS[b.dataset.id]; saveAll(); renderConfig(); });

  $('#catAdd').onclick=()=>{ const n=$('#ncN').value.trim(); if(!n){toast('Nome da categoria','err');return;} CATS.push({id:uid(),nome:n}); ensureMinimos(); saveAll(); renderConfig(); };
  $('#catSave').onclick=()=>{ $$('.cN').forEach(i=>{ const c=CATS.find(c=>c.id===i.dataset.id); if(c)c.nome=i.value.trim()||c.nome; }); saveAll(); toast('Categorias salvas','ok'); render(); };
  $$('.catDel').forEach(b=>b.onclick=()=>{ if(CATS.length<=1){toast('Mantenha ao menos 1 categoria','err');return;} CATS=CATS.filter(c=>c.id!==b.dataset.id); TURNOS.forEach(t=>{ if(MINIMOS[t.id])delete MINIMOS[t.id][b.dataset.id]; }); saveAll(); renderConfig(); });

  $('#ferAdd').onclick=()=>{ const d=$('#ferData').value; if(!d){toast('Escolha a data','err');return;} if(FERIAS.some(h=>h.data===d)){toast('Data já cadastrada','err');return;} FERIAS.push({data:d,nome:$('#ferNome').value.trim()||'Feriado'}); saveAll(); renderConfig(); };
  $$('.ferDel').forEach(b=>b.onclick=()=>{ FERIAS=FERIAS.filter(h=>h.data!==b.dataset.d); saveAll(); renderConfig(); });

  $('#demoSeed').onclick=()=>{
    const reais=FUNCS.filter(f=>!f.demo).length;
    if(temDemo()){
      if(!confirm('Já existe um banco de teste. Recriar do zero?\n\nOs dados de TESTE atuais são substituídos. Os seus dados reais não são tocados.'))return;
    }else if(reais){
      if(!confirm('Você já tem '+reais+' funcionário(s) cadastrado(s).\n\nO banco de teste ACRESCENTA 12 funcionários fictícios (marcados como "teste"), sem apagar nada do que é seu. Continuar?'))return;
    }
    removeDemo(); seedDemo(); saveAll(); renderConfig();
    toast('Banco de teste criado — veja a aba Escala diária','ok');
  };
  if($('#demoClear'))$('#demoClear').onclick=()=>{
    const d=demoCount();
    if(!confirm('Remover os dados de teste ('+d.funcs+' funcionário(s), '+d.trocas+' troca(s), '+d.banco+' lançamento(s), '+d.ferias+' feriado(s), '+d.receb+' item(ns) de recebimento, '+d.diverg+' divergência(s))?\n\nSeus dados reais permanecem.'))return;
    removeDemo(); saveAll(); renderConfig(); toast('Dados de teste removidos');
  };

  $$('.recRest').forEach(b=>b.onclick=()=>{
    const d=lerBackup(b.dataset.k); if(!d){ toast('Cópia vazia','err'); return; }
    const n=contarRegistros(d);
    if(!confirm('Restaurar '+n+' registro(s) desta cópia?\n\nO que está na tela agora será guardado como backup antes da troca.'))return;
    gravarBackup();
    if(d.funcs)FUNCS=d.funcs; if(d.trocas)TROCAS=d.trocas; if(d.banco)BANCO=d.banco; if(d.ferias)FERIAS=d.ferias;
    if(d.turnos)TURNOS=d.turnos; if(d.cats)CATS=d.cats; if(d.minimos)MINIMOS=d.minimos;
    if(d.receb)RECEB=d.receb; if(d.recdoc)RECDOC=d.recdoc; if(d.diverg)DIVERG=d.diverg;
    if(d.mensal)MENSAL=d.mensal; if(d.validade)VALIDADE=d.validade; if(d.valcfg)VALCFG=d.valcfg;
    ensureMinimos(); _ultimoTotal=null; saveAllInterno(); render(); selosDasAbas();
    toast(n+' registro(s) restaurado(s)','ok');
  });
  const rv=$('#recVer');
  if(rv)rv.onclick=()=>{
    const e=estadoAtual();
    openModal('O que está guardado agora','ti-list-details',
      '<div class="tbl-wrap"><table class="mini-tbl"><tbody>'
      +[['Funcionários',(e.funcs||[]).length],['Trocas',(e.trocas||[]).length],['Lançamentos de horas',(e.banco||[]).length],
        ['Escalas mensais',(e.mensal||[]).length],['Itens de recebimento',(e.receb||[]).length],
        ['Documentos lidos',(e.recdoc||[]).length],['Divergências',(e.diverg||[]).length],
        ['Produtos em validade',(e.validade||[]).length],['Feriados',(e.ferias||[]).length],
        ['Turnos',(e.turnos||[]).length],['Categorias',(e.cats||[]).length]]
        .map(r=>'<tr><td>'+r[0]+'</td><td class="num"><b>'+r[1]+'</b></td></tr>').join('')
      +'</tbody></table></div>'
      +'<p class="hint" style="margin:12px 0 0">Se algum número está zerado sem motivo, tente <b>Restaurar</b> uma cópia acima.</p>',
      '<button class="btn btn-ghost btn-sm" type="button" onclick="closeModal()">Fechar</button>');
  };

  $('#bkExport').onclick=()=>{
    const data={v:4,funcs:FUNCS,trocas:TROCAS,banco:BANCO,ferias:FERIAS,turnos:TURNOS,cats:CATS,minimos:MINIMOS,receb:RECEB,recdoc:RECDOC,diverg:DIVERG,mensal:MENSAL,validade:VALIDADE,valcfg:VALCFG};
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='farmaciagest-backup.json'; a.click(); URL.revokeObjectURL(a.href);
  };
  $('#bkImport').onclick=()=>$('#bkFile').click();
  $('#bkFile').onchange=e=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result);
    if(d.funcs)FUNCS=d.funcs; if(d.trocas)TROCAS=d.trocas; if(d.banco)BANCO=d.banco; if(d.ferias)FERIAS=d.ferias; if(d.turnos)TURNOS=d.turnos; if(d.cats)CATS=d.cats; if(d.minimos)MINIMOS=d.minimos; if(d.receb)RECEB=d.receb; if(d.recdoc)RECDOC=d.recdoc; if(d.diverg)DIVERG=d.diverg; if(d.mensal)MENSAL=d.mensal; if(d.validade)VALIDADE=d.validade; if(d.valcfg)VALCFG=d.valcfg;
    ensureMinimos(); saveAll(); render(); toast('Dados importados','ok'); }catch(err){ toast('Arquivo inválido','err'); } }; r.readAsText(f); e.target.value=''; };
  $('#bkClear').onclick=()=>{ if(confirm('Apagar TODOS os dados do app? Esta ação não pode ser desfeita.')){ gravarBackup(); FUNCS=[];TROCAS=[];BANCO=[];FERIAS=[];RECEB=[];RECDOC=[];DIVERG=[];MENSAL=[];VALIDADE=[]; _ultimoTotal=0; saveAllInterno(); render(); selosDasAbas(); toast('Dados apagados — ainda recuperáveis em Configurações → Recuperação'); } };
}

/* ================= start ================= */
{ const v=$('#verTag'); if(v)v.textContent='v'+APP_VER; }
ensureTurnosDasEscalas();
selosDasAbas();
setTimeout(()=>avisarVencimentos(false),1200);
{ let a='dia'; const hs=location.hash.slice(1); try{ const s=localStorage.getItem('sos-gestao:aba'); if(TABS.includes(s))a=s; }catch(e){} if(TABS.includes(hs))a=hs; selectTab(a); }
addEventListener('hashchange',()=>{ const hs=location.hash.slice(1); if(TABS.includes(hs)&&hs!==activeTab)selectTab(hs); });
</script>
</body>
